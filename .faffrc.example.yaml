# .faffrc.example.yaml — faff configuration template.
#
# Copy this to `.faffrc.yaml` at your repo root and edit. The `.example` file is a
# template only — faff never loads it as config.
#
# TWO-FILE MODEL (FAFF-387). faff config resolves from two optional files at the repo root:
#   .faffrc.yaml        — the BASE. Durable, shareable behaviour (slots, appetite,
#                         tracking paths, adversarial routing). RECOMMENDED: commit it —
#                         git is then its backup (`git checkout` restores a corrupted file)
#                         and its drift alarm (a silent wholesale rewrite shows up as a diff).
#                         It holds NO secrets by construction: `api_key_env` names an env var;
#                         the key value is read from the environment, never stored here.
#   .faffrc.local.yaml  — the OVERLAY. Optional, gitignored, machine-local. Put anything an
#                         operator considers private (an internal hostname, a personal model
#                         preference) here — it deep-merges OVER the base (maps merge per leaf,
#                         sequences replace wholesale, the overlay wins scalars).
# Run `faff config check` to verify posture (base committed? overlay ignored? no secret-shaped
# values?) — it's read-only and never writes or commits anything. A corrupted/lost file is
# `git checkout -- .faffrc.yaml` away from recovery only once the base is committed.
#
# Every key is optional; anything you omit falls back to faff's built-in default.
# Holds stable config only — never mutable tracker state (no milestones, dates,
# progress, or issue snapshots; those are fetched live on every invocation).
#
# This template mirrors the gateway schema (plugin/skills/faff/SKILL.md) — the gateway
# is the single source of truth if the two ever drift.

tracking:
  tracker: linear # linear | github | jira | … (autodetected from the available MCP if omitted)
  team_key: ABC # tracker team / board key
  project_id: "abc-123" # tracker project / team id
  repo: org/repo # org/repo slug
  git_host: github # github — the only supported host (the merge gate is GitHub-only; may be left unset)

  # Repository record stores. Each path is relative to the repo root. Defaults stay under
  # docs/ (or doc/ when that is the repository's established documentation directory).
  spec_docs_path: docs/specs/ # where /faff-graft commits the build spec
  prd_docs_path: docs/prd/
  prdr_docs_path: docs/prdr/
  adr_docs_path: docs/adr/
  spike_docs_path: docs/spikes/

# Optional delegation slots. Each has a sensible faff default when unset.
# Producers DO the work; adaptors TRANSLATE a producer's output onto a fixed
# faff-core contract. Swap a producer to change behaviour; swap an adaptor only
# when a producer speaks a dialect the default adaptor can't parse.
slots:
  # Producers / mechanisms (do the work)
  intake: # new-work discovery used by /faff-jot and /faff-plot (default: faffter-noon-intake; set superpowers:brainstorming or gstack:office-hours for heavier ideation)
  spec: # spec producer used by /faff-prep (default: faffter-noon-spec lite arc; set faffter-dark-nlspec for full nlspec)
  adr: # ADR-body producer invoked by /faff-graft Step 4b to author the Nygard Context/Decision/Consequences (default: faffter-noon-adr)
  architecture: # generative architecture/infra proposer — reads the brief/spec + infra profile and proposes one best-fit, build-biased design (default: faffter-noon-architecture; emits a faff-contract:architecture-proposal block; set a cost-first/cloud-native producer to change the proposing strategy)
  env: # environment provisioner — reads the architecture proposal + infra profile and stands up a representative, health-checked local stand-in (default: faffter-noon-env-compose docker-compose; emits a faff-contract:env-handle block; set a cloud-preview/persistent-staging producer to change the provisioning mechanism)
  review: # pre-PR review producer inside /faff-graft (default: faffter-noon-review; set faffter-dark-adversarial-review for an adversarial second opinion)
  gates: # engineering-quality gate ladder at /faff-graft Step 7.5 (default: built-in graft-step → `faff gates run` of the repo's own declared cheap checks; set a custom runner skill to override)
  ship: # delivery producer inside /faff-graft Step 10 (default: faffter-noon-ship — gh pr merge; set a deploy-capable producer e.g. gstack:land-and-deploy)
  concurrency: # build-pass executor for /faff-beep-boop (default: faffter-noon-concurrency-sequential; set faffter-dark-concurrency-parallel for capped, worktree-isolated concurrency)
  methodology: # diagnostic lens over backlog/build state (default: faffter-noon-methodology-thematic; set faffter-dark-methodology-agile-delivery for the opinionated agile lens)
  # Adaptors (translate a producer's output onto a fixed contract; validate conformance)
  # Note: spec / review / ship are producer-emitted — the producer self-declares a faff-contract:<name> block the consumer (faff-prep / faff-graft) parses; FAFF-109 retired their adaptor slots. Only the two below remain.
  routing_adaptor: # assigns + displays the automation-routing verdict; the six verdicts + admission rule are fixed in the gateway (default: faffidavit-routing)
  rendering_adaptor: # pure adaptor, no internal contract — house output style: visual vs prose, table-vs-list, density caps, issue-gloss humanisation (default: faffidavit-rendering)

# Per-lane model selection (FAFF-315/372). Optional; every key optional. Unset ⇒ each
# dispatch inherits the session/account model exactly as today (byte-for-byte).
# Only dispatch points that can actually consume a model appear here — a slot invoked
# inline via the Skill tool inherits the session model and cannot take a per-slot model.
# All lanes except eval take the CLOSED Agent-token set (sonnet | opus | haiku | fable,
# plus inherit); an off-vocabulary value FAILS LOUD at read (never a silent inherit).
# methodology / intake may ALSO take engine:<name> (FAFF-422 — the v1 pure-data-in
# allowlist), resolving the top-level engines: map below and dispatching via
# `faff engine call` instead of an Agent-tool subagent; any other lane given an
# engine: value fails loud at read naming the allowlist. eval is the eval frontier
# driver's model — a pinned default (never the account default), overridable per run
# with `run-evals --model <id>`.
models:
  build: # Agent-token — the concurrency executors' build subagents (default: inherit)
  prep_explore: # Agent-token — faff-prep's explore + clean-context verify subagents (default: inherit)
  spec: # Agent-token — the spec producer subagent (default: inherit)
  spec_review: # Agent-token — the spec-review producer subagent (default: inherit)
  architecture: # Agent-token — the architecture proposer subagent (default: inherit)
  methodology: # Agent-token or engine:<name> — the methodology producer dispatches (default: inherit)
  intake: # Agent-token or engine:<name> — the intake producer dispatch (default: inherit)
  eval: # model id for the eval frontier driver's `claude -p --model` (default: claude-sonnet-4-6)

# Shared model/provider/auth backend namespace (FAFF-523). A top-level, NAMED map — the
# generalization of the legacy top-level engines: map below (engines: folds into this
# namespace at load; a name declared in BOTH is a hard error, never last-wins) and of the
# adversarial block further down. Referenced BY NAME from anywhere that needs
# a model/backend: an engine:<name> lane value above, or an ordered `refs:` list (e.g. the
# adversarial block's own refs: form — see below). auth (subscription-seat |
# api-key | none) and egress (local | external) are explicit-preferred, else DERIVED:
# api_key_env present → api-key; keyless provider: anthropic → subscription-seat (binds to
# the AMBIENT interactive session — there is no seat_ref handle field); loopback/RFC1918/
# tailscale (*.ts.net) host → local egress, else external. provider: anthropic is accepted
# HERE (needed to name a subscription/API Claude endpoint) but still REFUSED at the
# `faff engine call` consumer boundary (that transport has no anthropic support — use the
# Agent-token models.<lane> vocabulary for Claude lanes instead).
# backends:
#   nvidia-glm:
#     provider: nvidia
#     model: z-ai/glm-5.2
#     host: https://integrate.api.nvidia.com/v1
#     api_key_env: NVIDIA_API_KEY   # → auth: api-key (derived); egress: external (derived, public host)
#     timeout: 480
#   studio-ollama:
#     provider: ollama    # an OpenAI-compatible ALIAS (FAFF-872) when referenced by an adversarial refs: list — no native transport
#     model: qwen3-next:80b-a3b-instruct-q4_K_M
#     host: http://studio.example.ts.net:11434/v1   # /v1 required; a bare host fails loud at preflight — auth: none, egress: local (both derived)
#   claude-sub:
#     provider: anthropic
#     model: claude-frontier
#     host: https://api.anthropic.com   # no api_key_env → auth: subscription-seat (derived; binds to the ambient session)
#
# A residency-sensitive consumer asserts `requires: local` on its OWN refs: list (see the
# adversarial example below) — any resolved egress: external ref in that
# chain refuses at run start (fail closed, never a silent leak); `faff backends realizable
# --refs a,b,c [--requires local]` runs this check standalone. `faff backends resolve
# --refs a,b,c` prints the resolved chain as JSON.

# Named local/self-hosted engines (FAFF-422). Referenced by an engine:<name> lane value
# above (v1: models.methodology / models.intake only). One definition serves many lanes.
# provider families: ollama, or the openai-compatible aliases (openai | vllm | openrouter |
# nvidia | deepseek | openai-compatible | gemini) — provider: anthropic is REFUSED at THIS
# consumer (Anthropic models are what the Agent-token vocabulary is for), even though the
# shared backends: namespace above accepts it. Dispatch is ONE non-streaming completion,
# fail-loud, no fallback chain: an invalid/unreachable engine is a named dispatch failure,
# never a silent session-model fallback. Secrets via api_key_env indirection (the env var
# NAME, never the key). FAFF-523: entries here fold into the shared backends: namespace
# above at load (a name in both blocks is a hard error) — this block remains the familiar
# spelling for an engine-only consumer; new work can declare directly under backends:.
# engines:
#   studio:
#     provider: ollama          # ollama | openai-compatible aliases; anthropic refused
#     model: qwen3-next:80b     # engine-specific model identifier
#     host: http://studio.example.ts.net:11434   # ollama: base host; openai-compatible: base URL incl. /v1
#     api_key_env:              # env var NAME holding the API key; optional (LAN ollama needs none)
#     reasoning_off: false      # true → disable reasoning-model think blocks (ollama think:false / openai chat_template_kwargs)
#     reasoning_effort:         # optional low|medium|high|xhigh|max — OpenAI-compat only; emits wire reasoning_effort (xhigh/max clamp to high); reasoning_off wins when both set
#     timeout: 120              # seconds — bounds the ONE completion attempt (default 120)

# Max concurrent builds for faffter-dark-concurrency-parallel. Ignored by the
# sequential default. Bounds worktree count, disk, and branches racing main.
concurrency_max: 4

# Per-invocation narrative logging. full (default) writes the prose narrative log
# .faff/logs/YYYY-MM-DD/HHMMSS-<skill>.md for every sub-skill invocation;
# essential silences that narrative write (jot/prep/graft/map/wtf) to save output
# tokens on long unattended runs. The machine-consumed hard floor — run-ledger,
# verdict caches, calibration/*, slot-validation, runs/<id>/… resume artifacts,
# summary.md, and tidy's HHMMSS-tidy.md — is written regardless of this knob.
logging: full # full | essential

# Where /faff-graft creates git worktrees. Default ~/.faff/worktrees/<repo>/<branch>
# (writable in repo-only bind-mounts/containers; isolates holdout/evaluator work).
# Uncomment to override; a configured value is used as-is (per-repo).
# worktree_root: ~/.faff/worktrees/myrepo

# (Slot conformance validation has no knob — a configured NON-DEFAULT slot
# occupant is always validated before first use, and the work parks/surfaces on
# non-conformance. Shipped defaults are conformant by construction and never
# validated, so the zero-config path is unaffected. See the gateway → Slot
# conformance validation.)

# Suite-wide autonomy dial. Controls how much agency the entire pipeline has —
# build decisions, methodology actions, backlog management, and pluggable skills.
# low: surface everything, act on nothing. medium: act on high-confidence, park ambiguity.
# high (default): act on defensible calls, auto-split, reorder by value, file gaps.
# full: complete autonomy — resolve everything, never park unless genuinely unknowable
# or irreversible. The hard floor (irreversible side-effects, review gate) still holds.
appetite: high

# FAFF-877: the bounded milestone-tick cadence a dispatched producer subagent (plot
# decompose, a prep spec producer) MUST honour — it ticks `faff heartbeat <run_dir>`
# at internal milestones no wider than this, strictly below sentry.stall_window_secs
# (see gateway → Sibling-skill invocation → Producer dispatch). This is the
# LOAD-BEARING liveness defence for a producer nested one level deep (its own
# methodology sub-calls fall back in-context and never fork to a supervised `faff
# engine call`), so a too-wide value re-opens the detached-sentry-poller
# false-positive-abort class this ticket fixes. Default (600s) sits well under half
# the default stall_window_secs (900s) / this repo's configured 2400s.
producer_tick_max_secs: 600

# Automation eligibility default for an UNLABELLED ticket (see gateway → Automation
# eligibility). opt-in (default, fail-safe): nothing is touched by the autonomous
# pipeline unless a human adds the faff-automate label — a forgotten label means
# "left alone". opt-out: unlabelled tickets are eligible — but this is scoped to
# GIT-ONLY mode (FAFF-753): on a tracker-bound repo opt-out is IGNORED and eligibility
# stays fail-safe opt-in (the two faff-* labels are the safe-space control surface;
# `faff config check` warns if you set opt-out with a tracker pinned). opt-out is
# meaningful only where no tracker resolves, as the sole autonomous on-switch. Add
# faff-automation-hold to hard-exclude; faff-automation-hold always wins regardless.
automation_default: opt-in   # opt-in | opt-out (opt-out is git-only-only — inert under a tracker)

# Phase-0 recovery-bundle store (FAFF-819/861). A top-level MODE ENUM, not a slot — slots delegate
# to user-swappable Skills, whereas these occupants are built-in implementations of a fixed
# BundleStore contract. `local` (default) keeps every bundle on-box; `git-remote` pushes each one
# to a write-once orphan ref (refs/faff/bundles/<run>/seg-<n>/<key>) on origin — no PR, no CI, and a
# store-unavailable push never fails the run. The occupant is the whole on/off + local-vs-distributed control.
bundle_store: local          # local | git-remote

# Intake-provenance guard (FAFF-212). faff-graft's pre-worktree precondition checks that a
# ticket entered through the front door (/faff-jot writes a CLI-owned .faff/provenance/<ISSUE>.json
# marker) rather than being retrofitted to satisfy the commit convention. A mechanism value (like
# automation_default / adr.mode), NOT a prose preference. warn (default): print guidance, never
# block (observe no-provenance counts before tightening) · block: refuse a ticket with no genuine
# provenance (legacy faff-jot-intake-labelled tickets are grandfathered through with a warning) ·
# off: disable the guard. Sanctioned override: faff intake-record <ISSUE> --via fast-track --reason "…".
intake_gate: warn   # warn (default) | block | off

# Engineering-quality gate ladder (FAFF-11), /faff-graft Step 7.5. When NO declared cheap checks
# are discoverable in the repo (discovery: none): fail-closed (default) treats the absence as
# needs-human (parks, no PR) — never green by silence; advisory is the explicit, loud opt-out that
# surfaces "no declared gates found" and passes, for a repo that legitimately has no gates.
gates:
  fallback: fail-closed        # fail-closed (default) | advisory  — discovery:none policy
  # FAFF-849 (639b): `faff gates run` executes the wider recognised set (848's reporting recogniser),
  # after subtracting steps it cannot run locally and capping the per-kind blast radius.
  partial: warn                # warn (default) | needs-human — when runnable coverage < partial_threshold,
                               #   warn keeps the signal + prints a partial-coverage line; needs-human gates it
  max_rungs_per_kind: 5        # cap on rungs run per kind (>=1; default 5), cheapest kept
  partial_threshold: 0.5       # runnable-coverage cutoff [0,1] below which `partial` fires (default 0.5)
  exclude: []                  # per-repo opt-out: commands whose text contains any entry are never run
                               #   (case-sensitive substring; e.g. ["regions selftest"] until FAFF-561 clears)

# Within-run convergence (FAFF-87), /faff-beep-boop. On by default: beep-boop folds execution-discovered
# scope into the SAME run — file → narrow-prep → re-assemble → loop — and delegates each wave-boundary
# stop to `faff run-done` (genuine dryness + budget + non-convergence backstop) instead of plain
# queue-empty. At L4 (lights-out) convergence is NON-OPTIONAL — the knob/flag cannot disable it
# (enabled: false and --no-converge are inert). The knob survives only to opt a single L3 run OUT of the
# per-layer human checkpoint, back to file-and-defer (--no-converge for one run, or enabled: false for a
# persistent L3 posture; --converge/--no-converge are mutually exclusive and a flag overrides this config).
# max_waves is a RUNAWAY BACKSTOP ONLY: K consecutive no-progress waves → a reported non-convergence
# escalate, never a silent truncation. Eligibility is not bypassed — discovered tickets re-enter only
# if automation-eligible (so meaningful in-run draining needs crank-up, or — git-only only — automation_default: opt-out).
convergence:
  enabled: true    # true (default) | false (L3 opt-out only; inert at L4)
  max_waves: 6     # runaway backstop K — consecutive no-progress waves before non-convergence escalate

# Run budget envelope (FAFF-36), /faff-beep-boop + `faff lights-out`. A set of ceilings across four
# dimensions plus one at-ceiling outcome; any subset, an unset dimension is unbounded. Resolved once at
# run start (--until / --max flags override). At L3 any ceiling is a legitimate cost idiom. At L4
# (`faff lights-out`) a SPEND/TIME ceiling (tokens / until / priced cost) is the MANDATORY launch
# precondition — a max_attempts count-cap alone is REFUSED (a tally is not an L4 governor: it is
# uncorrelated with project size or doneness, so it may ride along only as an extra backstop). The
# at_ceiling default is `stop` at L3; a lights-out run MINTS `escalate` when unset (a backstop that
# binds then surfaces as a structured needs-human, never a silent stop mid-project) — set `stop`
# explicitly to keep L3's quiet stop at the ceiling.
budget:
  until:              # HH:MM wall-clock ceiling (== --until)                    — spend/time
  max_attempts:       # build-attempt count      (== --max)                      — backstop only; NOT an L4 governor
  tokens:             # token ceiling (transcript-measured; estimate fallback)   — spend/time
  cost:               # cost ceiling = tokens × price_per_mtok                    — spend/time only when priced
  price_per_mtok: 0   # cost-dimension price input; 0 disables the cost dimension (an unpriced cost is inert, never breaches)
  at_ceiling: stop    # stop (L3 default) | narrow | escalate  (a lights-out run mints escalate when unset)
  est_tokens_per_attempt: 200000   # estimate-fallback per-attempt token figure when the transcript is unavailable

# Sentry — live-run derailment interrupt + hard kill-switch (FAFF-49). `faff sentry check` is consulted
# at every /faff-beep-boop dispatch boundary. A lights-out (L4) run ACTS on the intervention (pause →
# park the implicated issue and continue the queue; abort → mark the ledger aborted-resumable and launch
# nothing further; evaluator down → fail closed). A non-L4 run LOGS + surfaces the verdicts advisorily —
# shared telemetry and the calibration feed for these thresholds. Tune the thresholds, not the model, if
# a healthy run is aborted; an abort is resumable, so the cost is a paused night, not lost work.
sentry:
  thrash_n: 3                       # fix↔review thrash: >=N build-starts on one issue with no ship → trip
  failure_k: 3                      # repeated-identical-failure: same failure fingerprint >=K times → trip
  stall_window_secs: 900            # heartbeat staleness / no-progress window (seconds).
                                    # This is the ONLY lever for the detached sentry-poller
                                    # and `faff sentry check`. The env var
                                    # FAFF_RUN_HEARTBEAT_STALE_SECS is the runcheck/sentrycheck
                                    # Stop-hook knob and does NOT reach the poller — forwarding
                                    # it into the cage to widen the poller window is a no-op
                                    # (faff warns when you do). Set this key to widen it. (FAFF-887)
  run_elapsed_ceiling_secs: 14400   # absolute wall-clock run-elapsed ceiling (seconds; default 4h)

# Andon light — push alerting for run-critical events (FAFF-386). A cursor-based pump
# (`faff andon pump`, called by /faff-beep-boop at its between-units checkpoint + run end)
# reads NEW events.jsonl entries, classifies them against `events:` below, and POSTs one
# notification per distinct condition to `url`. UNSET url ⇒ the andon is dark: zero network
# calls, zero state writes — every other key below is inert until url is set. Fail-open by
# construction: a webhook failure never affects the run (see records/adr/0101).
#
# `url`/`token` are secret-bearing (an auth-carrying webhook endpoint) — set them in the
# gitignored `.faffrc.local.yaml` OVERLAY (see the two-file model note at the top of this
# file), never committed here, mirroring how `adversarial`'s `api_key_env`
# keeps the actual key value out of the committed base.
andon:
  url:                                        # webhook URL — e.g. an ntfy topic, a Slack/Discord incoming webhook
  format: generic                             # generic | ntfy | slack | discord — payload shaping preset
  token:                                      # sent as `Authorization: Bearer <token>` when set (ntfy/self-hosted auth)
  # The run-critical set below is the default and stays unchanged if you never touch this key.
  # Three opt-in INFORMATIONAL classes (FAFF-781) report lifecycle progress, not a run-critical
  # condition — none are on by default; add any of them alongside the defaults to opt in:
  #   "admitted"    — one run-level summary of every ticket this run admitted to the build queue
  #   "prep-start"  — one notification per issue when its prep stage begins
  #   "build-start" — one notification per issue when its build stage begins
  events: ["park", "sentry-trip", "budget-breach"]  # add "run-end", "admitted", "prep-start", "build-start" to opt in — quoted flow-list (parseYamlSubset's inline-JSON path; bareword items inside [...] do not parse)

# Architecture decision records (FAFF-16). After faff-prep attaches a spec, this controls
# whether it offers to promote that spec's architecturally-significant Chosen: decisions into
# the configured append-only ADR log. The `faff adr` CLI (next-number/new/list/validate) is
# always available regardless; this only gates the prep-time promotion offer.
adr:
  mode: offer   # offer (default): surface candidates + human-gated y/n write · surface: list only · off: nothing
  # ADR two-gate bound (FAFF-199) — the same thrash-ratchet shape as prdr.* below, ported to the ADR
  # axis: `faff adr admit` escalates (reject) a loop-provenance ADR lineage that accrues thrash_max
  # supersessions within thrash_window (days), even when each move individually passed the drift
  # challenge. Applies only to the autonomous admit-gated auto-supersede path; human/legacy-provenance
  # ADRs always stay propose-only regardless of the ratchet.
  thrash_max: 3       # max supersessions per lineage in the window before the ratchet breaches
  thrash_window: 21   # rolling window in days (the agent filters the lineage count to this)

# PRDR two-gate bound (FAFF-255). The thrash-ratchet bounds `faff prdr admit` uses to escalate a
# churning PRDR lineage: thrash_max supersessions accrued within thrash_window (days) on a single
# lineage breaches the ratchet (the admit verdict rejects/escalates, even when each move passed
# individually). Conservative defaults; raise thrash_max to tolerate more re-derivation.
prdr:
  thrash_max: 3       # max supersessions per lineage in the window before the ratchet breaches
  thrash_window: 21   # rolling window in days (the agent filters the lineage count to this)

# faffter-dark: LLM provider config for adversarial review.
# Used by the faffter-dark-adversarial-review skill (when set as the review slot).
# FAFF-872: two transport shapes (down from three — the native ollama transport was folded onto the
# OpenAI-compatible path). OpenAI-compatible (/v1/models preflight + /v1/chat/completions SSE) covers
# openai, vllm, openrouter, nvidia, deepseek, gemini (via Google's OpenAI-compat base URL — no adaptor
# needed, see the gemini example below), AND ollama/oMLX — ollama has no native transport of its own
# anymore; it is now an OpenAI-compatible ALIAS, so declare it provider: ollama (or provider: openai)
# with a host ending in /v1 and it rides this same path (a bare, non-/v1 host now fails LOUD at
# preflight instead of silently working — a deliberate migration signal, never auto-rewritten). anthropic
# keeps its own native shape (/v1/messages) — Claude's extended thinking can't cross to a plain
# /v1/chat/completions, so it is the one family kept native by design. For anthropic, set
# host: https://api.anthropic.com.
# INDEPENDENCE: don't set provider: anthropic when Claude wrote/ran the primary review — a same-family
# reviewer defeats the point (a *different* model family is the value). See the skill's independence note.
#
# FAFF-523: the form below (provider/model/host + fallbacks, inline) is the LEGACY shape —
# still fully supported, unchanged. The preferred shape for a config that already declares a
# backends: namespace (above) is a named refs: list instead, e.g.:
#   adversarial:
#     refs: [nvidia-glm, studio-ollama]   # ordered — index 0 first-served, no "primary"
#     requires: local                     # OPTIONAL: refuse at run start if any ref resolves egress: external
#     deadline: 480
# Named backends: entries do NOT inherit omitted optional fields from one another (unlike
# the legacy fallbacks form below) — each backend stands alone.
#
# FAFF-870: PER-CONSUMER chains. Each adversarial-review consumer (spec_review, code_review,
# prdr_review — or any future name; the seam is open-ended) may pin its OWN ordered refs: list
# and its own timeout, so a prose-challenge altitude and a diff-challenge altitude can run
# structurally different (or cheaper) models. UNSET per-consumer keys resolve BYTE-IDENTICALLY
# to the shared adversarial.* chain / timeout — zero change for existing configs. Only the chain
# (refs) and timeout split per-consumer; deadline and requires stay GLOBAL. e.g.:
#   adversarial:
#     refs: [nvidia-glm, studio-ollama]   # the shared default chain (any unset consumer falls back here)
#     requires: local                     # GLOBAL residency gate — applies to every consumer's refs
#     spec_review:
#       refs: [gemini-gemma]              # spec-altitude prose challenge — its own chain
#       timeout: 240                      # OPTIONAL — overrides adversarial.timeout for this consumer only
#     code_review:
#       refs: [nvidia-glm, studio-ollama] # diff-altitude challenge — its own chain
#     # prdr_review: { refs: [...] }      # any consumer name; unset => shared chain, byte-identical
#   # NB a consumer name must NOT reuse a reserved adversarial field name (refs / backends /
#   #    fallbacks / host / provider / model / api_key_env / reasoning_off / reasoning_effort /
#   #    timeout / deadline / requires) — those are the shared block's own fields, not a
#   #    per-consumer sub-block.
adversarial:
  provider: ollama # ollama | openai | vllm | openrouter | nvidia | deepseek | gemini | anthropic — ollama is an OpenAI-compatible ALIAS (FAFF-872), not a native transport
  model: llama3.1:70b # provider-specific model identifier
  host: http://localhost:11434/v1 # base URL incl. /v1 — every provider is OpenAI-compatible now (ollama included); a bare (non-/v1) host fails loud at preflight (D-host: never auto-rewritten)
  api_key_env: # env var NAME holding the API key, e.g. NVIDIA_API_KEY (never the key itself)
  # FAFF-872 migration note: the deleted native ollama transport FORCED thinking off (unconditionally,
  # regardless of this flag). The OpenAI-compatible path only disables it when reasoning_off is
  # explicitly true — unset now leaves thinking at the model's own default (may be ON). A migrated
  # ollama backend that relied on the old implicit always-off behaviour must set reasoning_off: true.
  reasoning_off: false # true → chat_template_kwargs:{thinking:false, enable_thinking:false} for reasoning models (deepseek, qwen3, ollama/oMLX)
  reasoning_effort: # optional low|medium|high|xhigh|max — OpenAI-compat wire reasoning_effort (xhigh/max clamp to high); reasoning_off wins when both set; unset omits the field entirely
  timeout: 120 # seconds — bounds ONE stream attempt
  deadline: 480 # FAFF-329: TOTAL wall-clock budget (seconds) across ALL attempts + fallback backends, so the
                # slow Phase-2 fits one subagent turn (default 480, under the 900s staleness window). Deadline-
                # exceeded → the second opinion is skipped (pass+skip, logged loudly), never a mid-turn stall.
                # Tune up if `phase2: skipped-deadline` shows in run logs while backends were healthy.
  # max_tokens: 2000  # OPTIONAL output-token cap for the reviewer's findings (OpenAI/anthropic
                       # max_tokens — every provider is OpenAI-compatible now, ollama included, FAFF-872).
                       # Default 2000; auto-doubled once to 4000 on a truncation
                       # retry. Resolution: adversarial.<consumer>.max_tokens || adversarial.max_tokens || 2000
                       # (per-consumer e.g. adversarial.code_review.max_tokens / adversarial.spec_review.max_tokens).
                       # Raise it (e.g. 8000) for a verbose reviewer that overruns 2000 on a large diff and
                       # returns empty/malformed. This raises the reasoning-OFF ceiling only — it does NOT make a
                       # reasoning-ON backend viable on a large prompt (that over-deliberates past any sane cap).
  # FAFF-232 — OPTIONAL ordered fallback chain. The block above is the PRIMARY backend; `fallbacks`
  # adds further backends, each tried in order when the one before fails to produce findings
  # (rate-limit / unreachable / persistent transport failure / auth / not-served). First findings win;
  # the gate keeps firing through one provider's outage instead of silently pass+skipping.
  # Each entry needs its own provider/model/host; omitted api_key_env/reasoning_off/
  # reasoning_effort/timeout inherit the primary's. Omit `fallbacks` entirely for
  # single-backend behaviour (unchanged).
  #
  # Two equivalent forms (FAFF-262 added the native list; the JSON-string still works for back-compat):
  #
  #   native YAML block sequence (preferred — commentable, diffable):
  # fallbacks:
  #   - provider: ollama
  #     model: qwen3-next:80b
  #     host: http://studio:11434/v1   # /v1 required (FAFF-872) — ollama is an OpenAI-compatible alias, no native transport
  #   - provider: openai
  #     model: gpt-4o
  #     host: https://api.openai.com/v1
  #     api_key_env: OPENAI_API_KEY
  #
  #   JSON-string scalar (legacy, still parsed):
  # fallbacks: '[{"provider":"ollama","model":"qwen3-next:80b","host":"http://studio:11434/v1"},{"provider":"openai","model":"gpt-4o","host":"https://api.openai.com/v1","api_key_env":"OPENAI_API_KEY"}]'
  # NVIDIA free testbed example:
  #   provider: nvidia
  #   model: deepseek-ai/deepseek-v4-pro
  #   host: https://integrate.api.nvidia.com/v1
  #   api_key_env: NVIDIA_API_KEY   # export NVIDIA_API_KEY=nvapi-...
  #   reasoning_off: true
  # Gemini example (rides the openai transport via Google's OpenAI-compat base URL — no adaptor):
  #   provider: gemini
  #   model: gemini-2.5-pro
  #   host: https://generativelanguage.googleapis.com/v1beta/openai   # base URL, no trailing /models
  #   api_key_env: GEMINI_API_KEY   # sent as Bearer
  # Anthropic example (native /v1/messages — x-api-key + anthropic-version; NO preflight, no reasoning_off):
  #   provider: anthropic
  #   model: claude-opus-4-8
  #   host: https://api.anthropic.com
  #   api_key_env: ANTHROPIC_API_KEY
  #   # ⚠ independence: do NOT use anthropic if Claude wrote/reviewed the code under review.

# (Calibration runs automatically — faff logs autonomous-call outcomes under
# .faff/calibration/ and surfaces advisory signals when a pattern crosses a
# built-in threshold (≥4 same-root-cause parks in 14 days; demote a repeat-parked
# Todo at 3+ parks in 21 days). No knobs — see the gateway → Calibration log.)
