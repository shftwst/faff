# faff — the harness's OWN repo config (Linear tracker · agile lens · nlspec spec).
# (Corrected 2026-07-01: previously carried a copied P1-link-shortener SUT / git-only header — a relic.)

tracking:
    spec_docs_path: docs/specs/ # where graft commits specs (git-only spec store is .faff/specs/)

slots:
    methodology: faffter-dark-methodology-agile-delivery # agile lens owns outcome-led project shape
    spec: faffter-dark-nlspec # full nlspec → born-verifiable ## Scenarios + ### N. DONE
    architecture: faffter-noon-architecture # PROPOSE box (default; explicit for clarity)
    env: faffter-noon-env-compose # PROVISION box (docker-compose via your Colima daemon)
    review: faffter-dark-adversarial-review # adversarial 2nd-opinion gate (RESTORED 2026-07-03 — dropped in the Jul 1 rewrite; see faffter_dark block below)
    # evaluator (faffter-noon-evaluate) is invoked via the holdout → prdr-coverage path, not an rc slot.

appetite: high
automation_default: opt-in # fail-safe: a ticket is automatable ONLY when a human adds `faff-automate` in the tracker (the control-plane gesture, FAFF-19/125/218)
intake_gate: warn

# FAFF-522 resolve-attempt: this repo's real gates (node --test, validate-adapters, …) run only via
# .github/workflows/validate.yml — `faff gates discover` v1 parses pre-commit/package.json/Makefile
# ONLY (no CI source yet), so THIS repo resolves discovery:none despite genuinely having gates. Since
# FAFF-522 flips the discovery:none default to fail-closed, an unset gates.fallback here would newly
# park every future autonomous build at Step 7.5 — a regression the ticket's own "repos WITH gates are
# unaffected" scope statement did not intend. Explicit advisory keeps this repo's Step 7.5 behaviour
# unchanged (CI is still the real, enforced gate via branch protection) pending a v2 discoverRungs CI
# source (tracked as discovered scope on FAFF-522).
gates:
    fallback: advisory

budget: # FABLE-WEEK (frontier --converge): spend/time BACKSTOP, not a count-cap (FAFF-312 model).
    max_attempts: 40 # runaway backstop ONLY (won't bind the scoped bulk slice); NOT the terminator
    tokens: 3000000000 # 3B runaway backstop (subscription covers the week; catches a true runaway)
    at_ceiling: escalate # surface a needs-human signal at the ceiling — never silently drain
    # run-done (dryness) + convergence.max_waves govern the real exit; budget is the backstop.
    # ORIGINAL (revert after the Fable week): max_attempts: 4 · tokens: 100000000 · at_ceiling: stop

convergence:
    enabled: true # within-run convergence on by default: drain execution-discovered scope in-run
    max_waves: 8 # reported runaway backstop only (dryness is the normal exit, never this)

# backends: (FAFF-523/529) — the shared named model/provider/auth namespace. Named entries the
# adversarial `review` slot (faffter-dark-adversarial-review) references by name below via
# faffter_dark.adversarial.refs. Replaces the legacy faffter_dark.adversarial primary+fallbacks
# scalar block (FAFF-529 migration; byte-equivalent to the pre-migration chain — golden fixture
# in docs/specs/2026-07-17-FAFF-529-…-design.md Appendix A).
backends:
    nvidia-glm:
        provider: nvidia
        model: z-ai/glm-5.2
        host: https://integrate.api.nvidia.com/v1
        auth: api-key
        api_key_env: NVIDIA_API_KEY # confirmed set in env (name only; never the key itself)
        egress: external
        timeout: 480
    gemini-gemma:
        provider: gemini
        model: models/gemma-4-31b-it # /v1beta/openai lists ids models/-prefixed; the served-check is exact-match
        host: https://generativelanguage.googleapis.com/v1beta/openai
        auth: api-key
        api_key_env: GEMINI_API_KEY
        egress: external
        timeout: 480
    studio-ollama:
        provider: ollama
        model: qwen3-next:80b-a3b-instruct-q4_K_M
        host: http://studio.longhair-escalator.ts.net:11434 # private tailnet host — kept COMMITTED (operator resolution, works committed for months; ADR-0067 names it a candidate for .faffrc.local.yaml, not a mandate)
        # byte-equivalence quirk (FAFF-529): the legacy resolver's inheritOptionalFromPrimary copied
        # the PRIMARY's api_key_env/timeout onto this element even though ollama needs no key.
        # Restated explicitly so `faff adversarial-backends` output stays byte-for-byte identical to
        # the pre-migration golden fixture — NOT a real auth requirement for ollama.
        auth: api-key
        api_key_env: NVIDIA_API_KEY
        egress: local
        timeout: 480

# faffter-dark: adversarial `review` slot's reference list — points at the named backends: entries
# above, primary-first (index 0 = first-served, no "primary" key — FAFF-523's ordered-reference
# form). This is FAFF-523's own landed shape (see its spec's worked example); the legacy scalar
# primary+fallbacks dialect this replaced is gone.
faffter_dark:
    adversarial:
        refs:
            - nvidia-glm
            - gemini-gemma
            - studio-ollama

models:
    #build: opus # Agent-token — the concurrency executors' build subagents (default: inherit)
    build_by_confidence:
        default: opus
        high: sonnet
        medium: opus
    prep_explore: sonnet # Agent-token — faff-prep's explore + clean-context verify subagents (default: inherit)
    eval: claude-opus-4-8
