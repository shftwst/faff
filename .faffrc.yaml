# faff — the harness's OWN repo config (Linear tracker · agile lens · nlspec spec).
# (Corrected 2026-07-01: previously carried a copied P1-link-shortener SUT / git-only header — a relic.)

tracking:
    tracker: linear # pin the tracker so the deterministic half of Tracker-availability resolution carries the eligibility guard without relying on live discovery (FAFF-753)
    spec_docs_path: records/specs/ # where graft commits specs (git-only spec store is .faff/specs/)
    prd_docs_path: records/prd/
    prdr_docs_path: records/prdr/
    adr_docs_path: records/adr/
    spike_docs_path: records/spikes/
    repo: shftwst/faff

slots:
    methodology: faffter-dark-methodology-agile-delivery
    spec: faffter-dark-nlspec
    spec_review: faffter-dark-spec-review
    architecture: faffter-noon-architecture
    concurrency: faffter-dark-concurrency-parallel
    env: faffter-noon-env-compose
    review: faffter-dark-adversarial-review
    # evaluator (faffter-noon-evaluate) is invoked via the holdout → prdr-coverage path, not an rc slot.

appetite: high
bundle_store: git-remote # top-level mode enum (local | git-remote), not a slot — push each Phase-0 recovery bundle to a write-once refs/faff/bundles/… orphan ref (FAFF-861)
automation_default: opt-in # fail-safe: a ticket is automatable ONLY when a human adds `faff-automate` in the tracker (the control-plane gesture, FAFF-19/125/218). On this tracker-bound repo opt-out would be inert anyway (FAFF-753 — opt-out is git-only-only).
intake_gate: warn

budget:
    max_attempts: 40 # runaway backstop ONLY (won't bind the scoped bulk slice); NOT the terminator
    tokens: 3000000000 # 3B runaway backstop only; never binds a normal run (dryness + convergence.max_waves are the real exit)
    at_ceiling: escalate # surface a needs-human signal at the ceiling — never silently drain
    # run-done (dryness) + convergence.max_waves govern the real exit; budget is the backstop.

convergence:
    enabled: true # within-run convergence on by default: drain execution-discovered scope in-run
    max_waves: 8 # reported runaway backstop only (dryness is the normal exit, never this)

backends:
  gemini-gemma-free:
      provider: gemini
      model: models/gemma-4-31b-it # /v1beta/openai lists ids models/-prefixed; the served-check is exact-match
      host: https://generativelanguage.googleapis.com/v1beta/openai
      api_key_env: GEMINI_API_KEY
      #timeout: 480
  studio-north-code-mini:
      provider: ollama
      model: north-mini-code-1.0:mlx-mxfp8
      host: http://studio.longhair-escalator.ts.net:11434
      #timeout: 480
  studio-qwen:
      provider: openai
      model: Qwen3.8-27B-4bit
      host: http://studio.longhair-escalator.ts.net:8001/v1
      api_key_env: OMLX_API_KEY
      reasoning_off: true
      first_byte_timeout: 1200
  studio-gemma:
      provider: openai
      model: gemma-4-31B-it-MLX-4bit
      host: http://studio.longhair-escalator.ts.net:8001/v1
      api_key_env: OMLX_API_KEY
      reasoning_off: true
      first_byte_timeout: 1200
  openrouter-glm-free:
      provider: openai                       # OpenRouter is OpenAI-compatible
      model: z-ai/glm-5.2:free
      host: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      #timeout: 480
  openrouter-nemotron-free:
      provider: openai                       # OpenRouter is OpenAI-compatible
      model: nvidia/nemotron-3-ultra-550b-a55b:free
      host: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      #timeout: 480
  openrouter-north-code-mini-free:
      provider: openai                       # OpenRouter is OpenAI-compatible
      model: cohere/north-mini-code:free
      host: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      #timeout: 480
  studio-qwen-coder:
      provider: ollama
      model: qwen3-coder:30b-a3b-q4_K_M
      host: http://studio.longhair-escalator.ts.net:11434
      #timeout: 480
  spark-qwen:
      provider: openai
      model: unsloth/Qwen3.8-27B-NVFP4
      host: https://spark.longhair-escalator.ts.net/qwen/v1
      api_key_env: DUMMY_API_KEY
      reasoning_off: true
      first_byte_timeout: 1200

# faffter-dark: adversarial `review`/`spec_review` slots' reference list — points at the named
# backends: entries above, primary-first (FAFF-523's ordered-reference form, no "primary" key).
# Flattened to the top-level `adversarial:` key per the schema change on faff main (the older
# `faffter_dark.adversarial.refs` nesting is retired; a stale local `faff config check` still warns
# on the flat form).
adversarial:
  # Larger deadline for the adversarial reviews. The local studio-qwen primary is slower than a
  # hosted API, and the default 120s per-attempt clock abandons a slow-but-working generation to a
  # weaker fallback (the round-3 degrade that helped park the last drain).
  #
  # The two review slots treat these knobs DIFFERENTLY (traced from their SKILL.md call sites):
  #   - spec_review (faffter-dark-spec-review) passes ONLY `--timeout`. It sends no `--deadline`, so
  #     `adversarial.deadline` below has NO effect on the spec review. `timeout` is its only clock,
  #     and there is no total wall-clock cap: its worst case is per-attempt x retries x lenses.
  #   - code_review (faffter-dark-adversarial-review) passes BOTH `--timeout` and `--deadline`. The
  #     deadline is a total wall-clock budget, GLOBAL (not per-consumer) and SLICED per backend
  #     (deadline / remaining-backends); each attempt is clamped to min(timeout, slice-now).
  # Resolution for both: timeout = adversarial.<slot>.timeout || adversarial.timeout || 120.
  timeout: 600     # per-attempt stream deadline (s); default 120. spec_review's only clock. 6x-retry worst case (3600s) stays under the 7200s heartbeat window.
  deadline: 1800   # code_review total wall-clock (s), sliced per backend (1800/3 = 600s = timeout, so no clamp); default 480. IGNORED by spec_review.
  first_byte_timeout: 300
  refs:
    - spark-qwen
    - studio-qwen
    - gemini-gemma-free
    - studio-gemma
    - openrouter-nemotron-free
models:
    build_by_confidence:
        default: inherit
        high: sonnet
        medium: inherit
    prep_explore: sonnet
    eval: claude-opus-4-8

sentry:
  stall_window_seconds: 7200
