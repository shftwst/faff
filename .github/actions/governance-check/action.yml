name: "faff governance-check"
description: >-
  Harness-independent enforcement binding (FAFF-363). Validates the run artifacts a PR
  carries (ledger completeness, budget, merge-floor conditions) as a required status
  check — thin wrapper over the `faff governance-check` CLI verb, which composes
  already-shipped governance cores and adds no new invariant. Emitting the artifact
  format is NOT the same as being governed until this check is marked required in
  branch protection; this check validates conformance, never artifact authenticity.
author: "faff"

inputs:
  faff-binary:
    description: >-
      Path to an in-checkout faff binary, relative to the consuming repo's checkout root.
      Used as-is when present (checkout-first resolution).
    required: false
    default: "plugin/skills/faff/bin/faff"
  faff-version:
    description: >-
      Release ref (commit sha or tag) to fetch the binary from raw.githubusercontent.com
      when no in-checkout binary is found. Pin a COMMIT SHA for external consumers — a tag
      is a mutable ref, and a moved tag silently swaps the enforcement binary.
    required: false
    default: ""
  artifacts-path:
    description: "Where carried run dirs live in the checkout."
    required: false
    default: ".faff/runs"
  anchors-path:
    description: >-
      Where committed per-PR chain anchors live in the checkout (FAFF-568). Anchors are
      immutable snapshots verified for chain integrity (always) and merge-floor conformance
      (FAFF-623, when the anchor carries ac-checklist.json/review-verdict.json/holdout.json) —
      never the completeness/budget/liveness sweep that live run dirs do (those stay run-scoped;
      a frozen anchor's run-ledger.json is not PR-scoped). An anchor carrying events.jsonl
      without its CLI-written chain-head.json witness fails the integrity leg (witness-absent,
      fail-closed).
    required: false
    default: ".faff/anchors"
  legacy-policy:
    description: >-
      How a schema-1 (pre-chain) or mixed-schema anchor is reported (FAFF-568): "pass"
      (adoption mode — the default; a legacy log is honestly unverifiable, never a
      broken-chain fail), "warn" (pass + a loud note in the check output), or "fail"
      (locked-down agent-only branches). The anchor-side sibling of on-missing. A
      chain-head.json witness mismatch (a post-anchor rewrite, including a spoofed
      legacy downgrade) always FAILS, under every policy.
    required: false
    default: "pass"
  on-missing:
    description: >-
      Policy when the PR's diff carries no governance artifacts at all: "pass" (adoption
      mode — the default; a required check must not block every human PR on a mixed repo)
      or "fail" (locked-down mode, for agent-only branches). Also governs the
      anchor-missing-for-run-dir condition (FAFF-568): a PR that carries run dir(s) but
      no chain anchor fails under "fail" and warns loudly under "pass" — never a silent
      pass.
    required: false
    default: "pass"
  issue:
    description: >-
      Explicit issue id for the merge-floor leg. Defaults to a case-insensitive
      [A-Za-z]+-[0-9]+ match against the PR's head branch name, upcased. When neither
      resolves, the verb itself falls back to every admitted issue with a terminal
      outcome in the carried run dir(s).
    required: false
    default: ""
  level:
    description: "Floor level (L1|L2|L3|L4)."
    required: false
    default: "L3"
  evidence-schema:
    description: >-
      How evidence-schema findings on the PR's anchors are treated (FAFF-1278, FAFF-1261):
      "require" (the default) passes --require-evidence-schema to the head verb and fails on the
      base-commit leg; "report" runs the base-commit evidence leg and the head verb's report-only
      leg and never fails on a schema finding. Integrity findings of the base-commit leg (anchor
      discovery failed, an anchor path left unvalidated, an edit to a committed anchor, no
      trusted validator) fail under either value.
    required: false
    default: "require"

outputs:
  verdict:
    description: >-
      pass | fail | no-artifacts — mirrors the step's exit code / on-missing outcome, and is fail
      whenever the PR touches anchors and the base-commit evidence leg is not positively clean.
    value: ${{ (steps.anchors-touched.outputs.touched == 'false' || (steps.evidence-schema-base.outcome == 'success' && steps.evidence-schema-base.outputs.verdict == 'pass')) && (steps.governance-check.outputs.verdict || steps.anchor-missing.outputs.verdict || steps.on-missing.outputs.verdict) || 'fail' }}
  evidence-result:
    description: >-
      pass | fail — what the base-commit evidence leg's validator found, in either evidence-schema
      mode. Empty when the PR touches no anchors.
    value: ${{ steps.evidence-schema-base.outputs.evidence_result }}

runs:
  using: "composite"
  steps:
    # 1a. Probe: does an in-checkout binary exist? An explicit boolean output — never
    # branch subsequent steps on stringified emptiness (same convention as `discover`'s
    # found=true|false below). Never fetches, never chmods, never errors.
    - name: Check for in-checkout faff binary
      id: check-binary
      shell: bash
      run: |
        set -euo pipefail
        BIN="${{ inputs.faff-binary }}"
        if [ -f "$BIN" ]; then
          echo "in-checkout=true" >> "$GITHUB_OUTPUT"
        else
          echo "in-checkout=false" >> "$GITHUB_OUTPUT"
        fi

    # 1b. In-checkout path. Step-level `if:`-gated — completely silent (no script-source
    # preview, no runtime output) when the fetch-pinned path ran instead.
    - name: Use in-checkout faff binary
      id: use-in-checkout
      if: steps.check-binary.outputs.in-checkout == 'true'
      shell: bash
      run: |
        set -euo pipefail
        BIN="${{ inputs.faff-binary }}"
        echo "faff governance-check: using in-checkout binary: $BIN"
        chmod +x "$BIN" 2>/dev/null || true
        echo "bin=$BIN" >> "$GITHUB_OUTPUT"

    # 1c. Fetch-pinned path: silent (skipped) on the in-checkout path — this is the
    # fix itself. Owns the entire fetch-or-fault flow, including both genuine
    # setup-fault ::error:: lines; those never leak into the log's source preview when
    # the in-checkout binary was found, because this whole step is `if:`-skipped
    # rather than an untaken branch inside a single executed script.
    - name: Fetch pinned faff binary
      id: fetch-pinned
      if: steps.check-binary.outputs.in-checkout == 'false'
      shell: bash
      run: |
        set -euo pipefail
        BIN="${{ inputs.faff-binary }}"
        if [ -z "${{ inputs.faff-version }}" ]; then
          echo "::error::faff governance-check: setup fault — no in-checkout binary at $BIN and no faff-version pinned to fetch one (pin a commit sha, preferably, or a tag)"
          exit 1
        fi
        BIN="${RUNNER_TEMP}/faff-governance-check-bin"
        URL="https://raw.githubusercontent.com/shftwst/faff/${{ inputs.faff-version }}/plugin/skills/faff/bin/faff"
        echo "faff governance-check: no in-checkout binary at ${{ inputs.faff-binary }} — fetching pinned ref from $URL"
        if ! curl -fsSL "$URL" -o "$BIN"; then
          echo "::error::faff governance-check: setup fault — failed to fetch the faff binary from $URL (faff-version=${{ inputs.faff-version }})"
          exit 1
        fi
        chmod +x "$BIN"
        echo "bin=$BIN" >> "$GITHUB_OUTPUT"

    # 2/3. Discover carried run dirs from the PR's own diff (never "newest dir in the
    # checkout" — a stale merged run must not satisfy a new PR). A changed path whose
    # run dir no longer exists at HEAD (the PR itself deleted it) is skipped — "not
    # carried anymore", never a stale false positive.
    - name: Discover carried run dirs
      id: discover
      shell: bash
      run: |
        set -euo pipefail
        ARTIFACTS_PATH="${{ inputs.artifacts-path }}"
        BASE_SHA="${{ github.event.pull_request.base.sha }}"
        HEAD_SHA="${{ github.event.pull_request.head.sha }}"
        DIRS=""
        if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "$ARTIFACTS_PATH" || true)"
          # `|| true` neutralises the pipefail-derived non-zero from the while loop's final
          # iteration failing `[ -d "$d" ]` (the alphabetically-last changed run dir was
          # deleted by this PR), so the assignment itself never trips errexit and every line
          # below stays reachable [FAFF-1047, same shape as FAFF-1038]. The `[ -d "$d" ]`
          # filter itself is untouched — deleted run dirs still never reach DIRS.
          DIRS="$(printf '%s\n' "$CHANGED" | awk -F/ -v p="$ARTIFACTS_PATH" 'NF>=2 {print p"/"$2}' | sort -u | while read -r d; do [ -n "$d" ] && [ -d "$d" ] && echo "$d"; done || true)"
        else
          echo "faff governance-check: not a pull_request event with base/head shas — skipping diff-based discovery"
        fi
        {
          echo "dirs<<GOVDIRSEOF"
          echo "$DIRS"
          echo "GOVDIRSEOF"
        } >> "$GITHUB_OUTPUT"
        # A dedicated boolean output — never branch subsequent steps on whether the
        # multiline `dirs` output STRINGIFIES to '' (GitHub's heredoc-style multiline
        # capture of an empty value is not guaranteed to compare equal to the empty
        # string literal in an `if:` expression — an ambiguity worth avoiding entirely
        # rather than relying on).
        if [ -n "$DIRS" ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi

    # FAFF-1278: whether the PR diff touches the anchors path, computed in shell with no faff
    # binary, so a crashing or rewritten head binary cannot stop it being written. It gates the
    # base-commit evidence leg below; `error` (git diff itself failed) fails that leg closed.
    - name: Check whether the PR touches anchors
      id: anchors-touched
      shell: bash
      env:
        ANCHORS_PATH: ${{ inputs.anchors-path }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -uo pipefail
        if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
          echo "touched=false" >> "$GITHUB_OUTPUT"
        elif CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "$ANCHORS_PATH" 2>/dev/null)"; then
          if [ -n "$CHANGED" ]; then echo "touched=true" >> "$GITHUB_OUTPUT"; else echo "touched=false" >> "$GITHUB_OUTPUT"; fi
        else
          echo "touched=error" >> "$GITHUB_OUTPUT"
        fi

    # FAFF-568: discover carried ANCHOR dirs from the PR diff, same base...head diff as
    # run dirs. Anchors route to the integrity leg ONLY (never the run-dir sweep), so
    # they are a SEPARATE input from artifacts-path — keeping the snapshot's run-scoped
    # ledger out of the completeness leg. The <path>/<run>/<issue> derivation lives in
    # the CLI (`--derive-anchor-dirs`), never an awk segment-count heuristic: it
    # prefix-strips the configured anchors-path (any depth), rejects ".." traversal
    # segments, and realpath-contains every derived dir under the anchors root —
    # dropped paths are warned on stderr, never silently skipped.
    - name: Discover carried anchor dirs
      id: discover-anchors
      shell: bash
      run: |
        set -euo pipefail
        BIN="${{ steps.use-in-checkout.outputs.bin || steps.fetch-pinned.outputs.bin }}"
        ANCHORS_PATH="${{ inputs.anchors-path }}"
        BASE_SHA="${{ github.event.pull_request.base.sha }}"
        HEAD_SHA="${{ github.event.pull_request.head.sha }}"
        DIRS=""
        if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "$ANCHORS_PATH" || true)"
          DIRS="$(printf '%s\n' "$CHANGED" | node "$BIN" governance-check --derive-anchor-dirs "$ANCHORS_PATH")"
        fi
        {
          echo "dirs<<GOVANCHORSEOF"
          echo "$DIRS"
          echo "GOVANCHORSEOF"
        } >> "$GITHUB_OUTPUT"
        if [ -n "$DIRS" ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi

    # Derive a default --issue from the PR head branch name when the caller didn't pass
    # one explicitly. A miss here is fine — the verb's own branch-name/admitted fallback
    # still applies (belt and braces; this saves the verb a git spawn when it's cheap
    # to resolve here from an already-known ref).
    - name: Derive issue from head branch (fallback default)
      id: derive-issue
      shell: bash
      run: |
        set -euo pipefail
        ISSUE="${{ inputs.issue }}"
        if [ -z "$ISSUE" ]; then
          BRANCH="${GITHUB_HEAD_REF:-}"
          ISSUE="$(printf '%s' "$BRANCH" | grep -ioE '[a-z]+-[0-9]+' | head -n1 | tr '[:lower:]' '[:upper:]' || true)"
        fi
        echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"

    # FAFF-568 fix pass: run-dir evidence WITHOUT an anchor is a distinct, named
    # condition (`anchor-missing-for-run-dir`) — a PR that carries a run dir but omits
    # (or deletes) its chain anchor never slides through silently. Under
    # `on-missing: fail` it fails the check; under `pass` it warns loudly (job summary
    # + annotation) and the sweep still runs. FAFF-562's locked-down flip inherits
    # this posture with the same knob.
    - name: Flag run-dir evidence without an anchor
      id: anchor-missing
      if: steps.discover.outputs.found == 'true' && steps.discover-anchors.outputs.found == 'false'
      shell: bash
      run: |
        set -euo pipefail
        LINE="anchor-missing-for-run-dir: the PR carries run dir(s) under \`${{ inputs.artifacts-path }}\` but no chain anchor under \`${{ inputs.anchors-path }}\` — on-missing: \`${{ inputs.on-missing }}\`"
        if [ "${{ inputs.on-missing }}" = "fail" ]; then
          # Fail path: the check step never runs, so this step owns the summary heading.
          {
            echo "## faff governance-check"
            echo ""
            echo "**⚠ $LINE**"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "verdict=fail" >> "$GITHUB_OUTPUT"
          echo "::error::faff governance-check: $LINE"
          exit 1
        fi
        # Warn path: the check step still runs and writes the ONE summary heading —
        # emit only the warning line here (no duplicate heading).
        echo "**⚠ faff governance-check: $LINE**" >> "$GITHUB_STEP_SUMMARY"
        echo "::warning::faff governance-check: $LINE"

    # 3. No carried run dirs ⇒ apply on-missing (write the summary line either way —
    # "emitting the format ≠ being governed" must always be visible, greppable).
    - name: Apply on-missing policy (no carried artifacts)
      id: on-missing
      if: steps.discover.outputs.found == 'false' && steps.discover-anchors.outputs.found == 'false'
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "## faff governance-check"
          echo ""
          echo "_no governance artifacts carried under \`${{ inputs.artifacts-path }}\` — on-missing: \`${{ inputs.on-missing }}\`_"
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "${{ inputs.on-missing }}" = "fail" ]; then
          echo "verdict=fail" >> "$GITHUB_OUTPUT"
          echo "::error::faff governance-check: no governance artifacts carried and on-missing is 'fail'"
          exit 1
        fi
        echo "verdict=no-artifacts" >> "$GITHUB_OUTPUT"
        echo "faff governance-check: no governance artifacts carried — on-missing 'pass' (adoption mode)"

    # 4/5. Run the verb; exit with the verb's code (the status-check verdict). No `set -e`
    # here — the exit code is deliberately observed and re-emitted, not merely propagated.
    - name: Run governance-check
      id: governance-check
      if: steps.discover.outputs.found == 'true' || steps.discover-anchors.outputs.found == 'true'
      shell: bash
      run: |
        set -uo pipefail
        BIN="${{ steps.use-in-checkout.outputs.bin || steps.fetch-pinned.outputs.bin }}"
        ARGS=()
        while IFS= read -r d; do
          [ -n "$d" ] && ARGS+=(--run-dir "$d")
        done <<< "${{ steps.discover.outputs.dirs }}"
        # FAFF-568/623: anchors are --anchor-dir targets (integrity + merge-floor legs), never a
        # full run-dir sweep (completeness/budget/liveness stay run-scoped).
        while IFS= read -r d; do
          [ -n "$d" ] && ARGS+=(--anchor-dir "$d")
        done <<< "${{ steps.discover-anchors.outputs.dirs }}"
        if [ -n "${{ steps.derive-issue.outputs.issue }}" ]; then
          ARGS+=(--issue "${{ steps.derive-issue.outputs.issue }}")
        fi
        ARGS+=(--level "${{ inputs.level }}")
        ARGS+=(--legacy-policy "${{ inputs.legacy-policy }}")
        if [ "${{ inputs.evidence-schema }}" = "require" ]; then
          ARGS+=(--require-evidence-schema)
        fi
        # FAFF-568 fix pass: the CLI re-asserts anchors-path containment on every
        # --anchor-dir (defence-in-depth behind the discovery step's own check).
        if [ "${{ steps.discover-anchors.outputs.found }}" = "true" ]; then
          ARGS+=(--anchors-root "${{ inputs.anchors-path }}")
        fi
        node "$BIN" governance-check "${ARGS[@]}" --summary-md "$GITHUB_STEP_SUMMARY"
        CODE=$?
        if [ "$CODE" -eq 0 ]; then
          echo "verdict=pass" >> "$GITHUB_OUTPUT"
        else
          echo "verdict=fail" >> "$GITHUB_OUTPUT"
        fi
        exit "$CODE"

    # FAFF-1278: the base-commit evidence leg. Everything above runs PR-head code; these two
    # steps judge the PR's anchors with the PR BASE commit's faff CLI, so a PR cannot weaken the
    # validator, manifest or schemas that judge it. Both run after the head verb under
    # !cancelled(), so a head verb that failed or found nothing cannot skip them. The plugin path
    # is a constant here, never derived from the faff-binary input: changing where trusted code
    # comes from means editing .github/, which code-owner review covers.
    - name: Resolve trusted faff CLI
      id: resolve-trusted-cli
      if: ${{ !cancelled() && steps.anchors-touched.outputs.touched != 'false' }}
      shell: bash
      env:
        IN_CHECKOUT: ${{ steps.check-binary.outputs.in-checkout }}
        PINNED_BIN: ${{ steps.fetch-pinned.outputs.bin }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        PLUGIN="plugin/skills/faff"
        if [ "$IN_CHECKOUT" = "true" ]; then
          if ! git cat-file -e "$BASE_SHA:$PLUGIN/bin/faff" 2>/dev/null; then
            echo "unavailable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -rf "$RUNNER_TEMP/faff-base"
          mkdir -p "$RUNNER_TEMP/faff-base"
          git archive "$BASE_SHA" -- "$PLUGIN" | tar -x -C "$RUNNER_TEMP/faff-base"
          TRUSTED="$RUNNER_TEMP/faff-base/$PLUGIN/bin/faff"
          CANDIDATE="$GITHUB_WORKSPACE/$PLUGIN/contracts/evidence-v0.3"
        else
          TRUSTED="$PINNED_BIN"
          CANDIDATE=""
        fi
        mkdir -p "$RUNNER_TEMP/faff-trusted-cwd" "$RUNNER_TEMP/faff-home"
        run_trusted() { (cd "$RUNNER_TEMP/faff-trusted-cwd" && env -i PATH="$PATH" HOME="$RUNNER_TEMP/faff-home" node "$TRUSTED" "$@"); }
        CAPS="$(run_trusted evidence capabilities --json 2>/dev/null || true)"
        has_cap() {
          node -e 'let c; try { c = JSON.parse(process.argv[1]); } catch { c = null; }
            process.exit(c && Array.isArray(c.validate) && c.validate.includes(process.argv[2]) ? 0 : 1);' "$CAPS" "$1"
        }
        has_cap candidate-schemas || CANDIDATE=""
        if has_cap holdout-binding; then HOLDOUT_BINDING=true; else HOLDOUT_BINDING=false; fi
        {
          echo "unavailable=false"
          echo "trusted=$TRUSTED"
          echo "candidate=$CANDIDATE"
          echo "holdout-binding=$HOLDOUT_BINDING"
        } >> "$GITHUB_OUTPUT"

    # Re-discovers the anchors with the trusted CLI, refuses changed anchor files no validated
    # dir covers and edits to committed anchors (integrity findings, failing in either mode), then
    # validates each anchor. Reports are captured to files and never echoed: they hold violation
    # text that can carry evidence values. Only paths, statuses and counts reach the log and
    # summary, each through `clean`, which applies sanitiseDisplay's rules and escapes `|`.
    - name: Evidence schema (base commit)
      id: evidence-schema-base
      if: ${{ !cancelled() && steps.anchors-touched.outputs.touched != 'false' }}
      shell: bash
      env:
        MODE: ${{ inputs.evidence-schema }}
        TOUCHED: ${{ steps.anchors-touched.outputs.touched }}
        UNAVAILABLE: ${{ steps.resolve-trusted-cli.outputs.unavailable }}
        TRUSTED: ${{ steps.resolve-trusted-cli.outputs.trusted }}
        CANDIDATE: ${{ steps.resolve-trusted-cli.outputs.candidate }}
        HOLDOUT_BINDING: ${{ steps.resolve-trusted-cli.outputs.holdout-binding }}
        ANCHORS_PATH: ${{ inputs.anchors-path }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        REPORTS="$RUNNER_TEMP/faff-evidence"
        VERDICT_WRITTEN=false
        finish() {
          local rc=$?
          rm -rf "$REPORTS"
          if [ "$VERDICT_WRITTEN" != true ]; then
            echo "verdict=fail" >> "$GITHUB_OUTPUT"
            echo "::error::faff governance-check: the base-commit evidence leg stopped before reaching a verdict"
            exit 1
          fi
          exit "$rc"
        }
        trap finish EXIT
        rm -rf "$REPORTS"
        mkdir -p "$REPORTS" "$RUNNER_TEMP/faff-trusted-cwd" "$RUNNER_TEMP/faff-home"
        run_trusted() { (cd "$RUNNER_TEMP/faff-trusted-cwd" && env -i PATH="$PATH" HOME="$RUNNER_TEMP/faff-home" node "$TRUSTED" "$@"); }
        CLEAN='const clean = (v) => String(v).replace(/[\u0000-\u001f\u007f-\u009f]/g, " ").replaceAll("::", ": :").replaceAll("|", "\\|");'
        clean() { node -e "$CLEAN"' process.stdout.write(clean(process.argv[1]));' "$1"; }
        # Workflow-command data is percent-decoded by the runner, so `%` is escaped before it is printed.
        annotate() { printf '::%s::faff governance-check: %s\n' "$1" "${2//%/%25}"; }
        # One line per report: status, candidate status, failing files. Unreadable reports read as error.
        REPORT_LINE="$CLEAN"'
          let r; try { r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); } catch { r = null; }
          const ok = r !== null && typeof r === "object" && !Array.isArray(r);
          const status = ok && ["pass", "fail", "legacy"].includes(r.status) ? r.status : "error";
          let candidate = "n/a";
          if (ok && Array.isArray(r.candidate_rejected)) {
            const rejected = r.candidate_rejected.map((c) => (c && typeof c.path === "string" ? c.path : "?"));
            candidate = rejected.length === 0 ? "accepted"
              : rejected.includes("anchor-manifest.json") ? "rejected"
              : `partial (${rejected.map(clean).join(", ")})`;
          }
          const failing = ok && Array.isArray(r.files)
            ? r.files.filter((f) => f && f.status !== "ok").map((f) => `${clean(f.path)} (${clean(f.status)})`) : [];
          const shown = failing.slice(0, 5).join(", ") + (failing.length > 5 ? ` (+${failing.length - 5} more)` : "");
          process.stdout.write([status, candidate, shown || "-"].join("\t") + "\n");'

        INTEGRITY=()
        DIRS=()
        ANCHORS="${ANCHORS_PATH%/}"
        prefix_workspace() { while IFS= read -r line; do printf '%s/%s\n' "$GITHUB_WORKSPACE" "$line"; done; }
        covered() {
          local abs="$GITHUB_WORKSPACE/$1" d
          for d in "${DIRS[@]}"; do
            case "$abs" in "$d"/*) return 0 ;; esac
          done
          return 1
        }
        # The run-level summary `faff events anchor-run` writes at <anchors>/<run>/summary.md.
        is_run_summary() {
          local rest="${1#"$ANCHORS"/}"
          [ "$rest" != "$1" ] && [[ "$rest" =~ ^[^/]+/summary\.md$ ]]
        }

        case "$MODE" in
          report|require) ;;
          *) INTEGRITY+=("evidence-schema-input-invalid: expected report or require") ;;
        esac
        if [ "$TOUCHED" = "error" ]; then
          INTEGRITY+=("anchor-discovery-failed: git diff exited non-zero")
        elif [ "$UNAVAILABLE" != "false" ] || [ -z "$TRUSTED" ]; then
          INTEGRITY+=("evidence-validator-unavailable: base commit has no faff CLI")
        else
          if CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "$ANCHORS")" \
            && DERIVED="$(printf '%s\n' "$CHANGED" | prefix_workspace | run_trusted governance-check --derive-anchor-dirs "$GITHUB_WORKSPACE/$ANCHORS" 2>/dev/null)"; then
            while IFS= read -r d; do
              if [ -n "$d" ]; then DIRS+=("$d"); fi
            done <<< "$DERIVED"
          else
            INTEGRITY+=("anchor-discovery-failed: trusted anchor discovery exited non-zero")
          fi

          # Coverage: every changed anchors-path file present in head sits inside a validated dir.
          if git diff -z --name-only --diff-filter=AM "$BASE_SHA" "$HEAD_SHA" -- "$ANCHORS" > "$REPORTS/changed.z" \
            && git diff -z --raw --no-renames "$BASE_SHA" "$HEAD_SHA" -- "$ANCHORS" > "$REPORTS/raw.z"; then
            while IFS= read -r -d '' p; do
              covered "$p" || is_run_summary "$p" || INTEGRITY+=("anchor-path-unvalidated $(clean "$p")")
            done < "$REPORTS/changed.z"
            while IFS= read -r -d '' meta && IFS= read -r -d '' p; do
              read -r _ mode _ <<< "$meta"
              if [ "$mode" = "120000" ]; then INTEGRITY+=("anchor-path-unvalidated $(clean "$p")"); fi
            done < "$REPORTS/raw.z"
          else
            INTEGRITY+=("anchor-discovery-failed: git diff exited non-zero")
          fi

          # Immutability: a PR never modifies, deletes or adds to an anchor committed at the merge base.
          if MB="$(git merge-base "$BASE_SHA" "$HEAD_SHA")" \
            && git diff -z --name-status --no-renames "$MB" "$HEAD_SHA" -- "$ANCHORS" > "$REPORTS/status.z"; then
            while IFS= read -r -d '' status && IFS= read -r -d '' p; do
              if [ "$status" != "A" ]; then
                INTEGRITY+=("anchor-immutable $(clean "$p")")
                continue
              fi
              rest="${p#"$ANCHORS"/}"
              run="${rest%%/*}"
              below="${rest#*/}"
              issue="${below%%/*}"
              if [ "$below" != "$rest" ] && [ "$issue" != "$below" ] && git cat-file -e "$MB:$ANCHORS/$run/$issue" 2>/dev/null; then
                INTEGRITY+=("anchor-immutable $(clean "$p")")
              fi
            done < "$REPORTS/status.z"
          else
            INTEGRITY+=("anchor-discovery-failed: git merge-base exited non-zero")
          fi
        fi

        # Nothing was validated when discovery or the trusted CLI was missing, so the result is fail.
        if [ "$TOUCHED" = "error" ] || [ "$UNAVAILABLE" != "false" ] || [ -z "$TRUSTED" ]; then EVIDENCE_RESULT=fail; else EVIDENCE_RESULT=pass; fi
        ROWS=()
        HOLDOUT_SEEN=false
        n=0
        for d in "${DIRS[@]}"; do
          n=$((n + 1))
          ARGS=(evidence validate "$d" --require-evidence-schema --json)
          if [ -n "$CANDIDATE" ]; then ARGS+=(--candidate-schemas "$CANDIDATE"); fi
          rc=0
          run_trusted "${ARGS[@]}" > "$REPORTS/$n.json" 2> /dev/null || rc=$?
          IFS=$'\t' read -r status candidate failing < <(node -e "$REPORT_LINE" "$REPORTS/$n.json")
          name="$(clean "${d#"$GITHUB_WORKSPACE"/}")"
          if [ -e "$d/holdout.json" ]; then HOLDOUT_SEEN=true; fi
          if [ "$rc" -eq 0 ]; then
            ROWS+=("| $name | ok | $status | $failing | $candidate |")
          else
            EVIDENCE_RESULT=fail
            ROWS+=("| $name | **fail** | $status | $failing | $candidate |")
            if [ "$MODE" = "require" ]; then level=error; else level=warning; fi
            annotate "$level" "evidence-schema (base commit) $name: $status"
          fi
        done

        HOLDOUT_NOTE=""
        if [ "$MODE" = "require" ] && [ "$HOLDOUT_SEEN" = true ] && [ "$HOLDOUT_BINDING" != "true" ]; then
          HOLDOUT_NOTE="holdout binding not checked: base CLI predates FAFF-1261"
          annotate warning "$HOLDOUT_NOTE"
        fi
        for finding in "${INTEGRITY[@]}"; do
          annotate error "$finding"
        done

        {
          echo ""
          echo "### Evidence schema (base commit ${BASE_SHA:0:12})"
          echo ""
          echo "mode: \`$(clean "$MODE")\` · validator result: $EVIDENCE_RESULT"
          echo ""
          for finding in "${INTEGRITY[@]}"; do echo "- **integrity:** $finding"; done
          if [ -n "$HOLDOUT_NOTE" ]; then echo "- $HOLDOUT_NOTE"; fi
          if [ "${#ROWS[@]}" -gt 0 ]; then
            echo ""
            echo "| anchor | result | status | non-conforming files | candidate schemas |"
            echo "|---|---|---|---|---|"
            printf '%s\n' "${ROWS[@]}"
          fi
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"

        VERDICT=pass
        if [ "${#INTEGRITY[@]}" -gt 0 ]; then VERDICT=fail; fi
        if [ "$EVIDENCE_RESULT" = "fail" ] && [ "$MODE" = "require" ]; then VERDICT=fail; fi
        {
          echo "evidence_result=$EVIDENCE_RESULT"
          echo "verdict=$VERDICT"
        } >> "$GITHUB_OUTPUT"
        VERDICT_WRITTEN=true
        if [ "$VERDICT" != "pass" ]; then exit 1; fi
