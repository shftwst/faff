name: governance-check

# FAFF-363: faff's own dogfood of the harness-independent enforcement binding — the
# factory becomes consumer #1 of the layer it ships, alongside the Stop hooks (belt and
# braces at different chokepoints). `on-missing: pass` (adoption mode) because faff's own
# repo is mixed (human PRs alongside agent-built ones) and no emitter-side step yet
# commits run dirs onto PR branches (that's its own slice — see the FAFF-363 spec's OUT
# OF SCOPE). Marking this check REQUIRED in branch protection stays a documented human
# toggle (assert-don't-enforce, mirroring branch-protection-check's own posture) — this
# workflow only makes the check RUNNABLE.

on:
  pull_request:

permissions:
  contents: read

jobs:
  governance-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the Action's `git diff <base>...<head>` discovery (never
          # "newest dir in the checkout") can actually resolve both endpoints.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: faff governance-check
        uses: ./.github/actions/governance-check
        with:
          on-missing: pass
