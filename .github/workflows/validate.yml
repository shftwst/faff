name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate slot-skill contracts
        run: node skills/faff/bin/faff validate-adapters

      - name: Validate config template parses
        run: |
          tmp="$(mktemp -d)"
          cp .faffrc.example.yaml "$tmp/.faffrc.yaml"   # canonical name (FAFF-50: only .faffrc.yaml is accepted)
          ( cd "$tmp" && node "$GITHUB_WORKSPACE/skills/faff/bin/faff" config dump >/dev/null )

      - name: Validate orchestration transition table
        run: node skills/faff/bin/faff next --selftest

      - name: Validate config init writer
        run: node skills/faff/bin/faff config init --selftest

      - name: Validate spec-readiness contract script
        run: node skills/faff/bin/faff contract spec-readiness --selftest

      - name: Validate review-verdict contract script
        run: node skills/faff/bin/faff contract review-verdict --selftest
