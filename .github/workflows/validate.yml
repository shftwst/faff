name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate slot-skill contracts
        run: node skills/faff/bin/faff validate-adapters

      - name: Validate config template parses
        run: |
          tmp="$(mktemp -d)"
          cp .faffrc.example.yml "$tmp/.faffrc.yml"
          ( cd "$tmp" && node "$GITHUB_WORKSPACE/skills/faff/bin/faff" config dump >/dev/null )
