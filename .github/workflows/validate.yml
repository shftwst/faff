name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate slot-skill contracts
        run: node plugin/skills/faff/bin/faff validate-adapters

      - name: Validate self-contained prose (no external-artifact refs in docs/guide)
        run: |
          node plugin/skills/faff/bin/faff lint-refs --selftest
          node plugin/skills/faff/bin/faff lint-refs

      - name: Validate CLI reference doc covers every subcommand (docs/guide/cli.md)
        run: |
          node plugin/skills/faff/bin/faff lint-cli-doc --selftest
          node plugin/skills/faff/bin/faff lint-cli-doc

      - name: Validate config template parses
        run: |
          tmp="$(mktemp -d)"
          cp .faffrc.example.yaml "$tmp/.faffrc.yaml"   # canonical name (FAFF-50: only .faffrc.yaml is accepted)
          ( cd "$tmp" && node "$GITHUB_WORKSPACE/plugin/skills/faff/bin/faff" config dump >/dev/null )

      - name: Validate orchestration transition table
        run: node plugin/skills/faff/bin/faff next --selftest

      - name: Validate container state-coherence transition table (FAFF-248)
        run: node plugin/skills/faff/bin/faff project-next --selftest

      - name: Validate config init writer
        run: node plugin/skills/faff/bin/faff config init --selftest

      - name: Validate automation-eligibility table
        run: node plugin/skills/faff/bin/faff eligible --selftest

      - name: Validate lights-out admissibility verdict table
        run: node plugin/skills/faff/bin/faff admissible --selftest

      - name: Validate label-op descriptor table
        run: node plugin/skills/faff/bin/faff label --selftest

      - name: Validate ADR command + the repo's own docs/adr tree
        run: |
          node plugin/skills/faff/bin/faff adr --selftest
          node plugin/skills/faff/bin/faff adr validate

      - name: Validate spec-readiness contract script
        run: node plugin/skills/faff/bin/faff contract spec-readiness --selftest

      - name: Validate review-verdict contract script
        run: node plugin/skills/faff/bin/faff contract review-verdict --selftest

      - name: Validate delivery-outcome contract script
        run: node plugin/skills/faff/bin/faff contract delivery-outcome --selftest

      - name: Validate automation-routing contract script
        run: node plugin/skills/faff/bin/faff contract automation-routing --selftest

      - name: Validate quality-gates contract script
        run: node plugin/skills/faff/bin/faff contract quality-gates --selftest

      - name: Validate prd-readiness contract script
        run: node plugin/skills/faff/bin/faff contract prd-readiness --selftest

      - name: Validate prdr-admission contract script
        run: node plugin/skills/faff/bin/faff contract prdr-admission --selftest

      - name: Validate prdr-yagni (upper/YAGNI gate) contract script
        run: node plugin/skills/faff/bin/faff contract prdr-yagni --selftest

      - name: Validate prd-coverage (lower/coverage gate + prd-satisfied roll-up) contract script
        run: node plugin/skills/faff/bin/faff contract prd-coverage --selftest

      - name: Validate prdr command + the upper-gate arbitration table
        run: node plugin/skills/faff/bin/faff prdr --selftest

      - name: Validate engineering-quality gate ladder
        run: node plugin/skills/faff/bin/faff gates --selftest

      - name: Validate infra-profile validator table (FAFF-26)
        run: node plugin/skills/faff/bin/faff profile --selftest

      - name: Validate park-history repeat-park counting table
        run: node plugin/skills/faff/bin/faff park-history --selftest

      - name: Validate prepcheck attach-state audit table
        run: node plugin/skills/faff/bin/faff prepcheck --selftest

      - name: Validate intake-provenance verdict + interactive-bypass table
        run: node plugin/skills/faff/bin/faff intakecheck --selftest

      - name: Validate intake-record via/initiated table
        run: node plugin/skills/faff/bin/faff intake-record --selftest

      - name: Validate hooks-ensure Stop-hook registration table
        run: node plugin/skills/faff/bin/faff hooks-ensure --selftest

      - name: Validate contain subtree-of-mandate containment table
        run: node plugin/skills/faff/bin/faff contain --selftest

      - name: Validate budget envelope/state table (FAFF-36)
        run: node plugin/skills/faff/bin/faff budget --selftest

      - name: Prompt-size budget gate (advisory)
        run: |
          node eval/size-census.mjs --gate --against eval/baselines/prompt-size.json | tee -a "$GITHUB_STEP_SUMMARY"
          # flip to enforcing once the post-lean floor is calibrated:
          #   node eval/size-census.mjs --gate --against eval/baselines/prompt-size.json --enforce

      - name: Run skill/CLI behaviour tests (node:test)
        run: node --test
