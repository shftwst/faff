name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate slot-skill contracts
        run: node plugin/skills/faff/bin/faff validate-adapters

      - name: Validate self-contained prose (no external-artifact refs in docs/guide)
        run: |
          node plugin/skills/faff/bin/faff lint-refs --selftest
          node plugin/skills/faff/bin/faff lint-refs

      - name: Validate CLI reference doc covers every subcommand (docs/guide/cli.md)
        run: |
          node plugin/skills/faff/bin/faff lint-cli-doc --selftest
          node plugin/skills/faff/bin/faff lint-cli-doc

      - name: Validate config template parses
        run: |
          tmp="$(mktemp -d)"
          cp .faffrc.example.yaml "$tmp/.faffrc.yaml"   # canonical name (FAFF-50: only .faffrc.yaml is accepted)
          ( cd "$tmp" && node "$GITHUB_WORKSPACE/plugin/skills/faff/bin/faff" config dump >/dev/null )

      - name: Validate orchestration transition table
        run: node plugin/skills/faff/bin/faff next --selftest

      - name: Validate container state-coherence transition table (FAFF-248)
        run: node plugin/skills/faff/bin/faff project-next --selftest

      - name: Validate config init writer
        run: node plugin/skills/faff/bin/faff config init --selftest

      - name: Validate automation-eligibility table
        run: node plugin/skills/faff/bin/faff eligible --selftest

      - name: Validate lights-out admissibility verdict table
        run: node plugin/skills/faff/bin/faff admissible --selftest

      - name: Validate label-op descriptor table
        run: node plugin/skills/faff/bin/faff label --selftest

      - name: Validate ADR command + the repo's own docs/adr tree
        run: |
          node plugin/skills/faff/bin/faff adr --selftest
          node plugin/skills/faff/bin/faff adr validate

      - name: Validate PRDR command + the repo's own docs/prdr tree (FAFF-463 — shape + numbering + git-landing tier)
        run: node plugin/skills/faff/bin/faff prdr validate

      - name: Validate spec-readiness contract script
        run: node plugin/skills/faff/bin/faff contract spec-readiness --selftest

      - name: Validate review-verdict contract script
        run: node plugin/skills/faff/bin/faff contract review-verdict --selftest

      - name: Validate delivery-outcome contract script
        run: node plugin/skills/faff/bin/faff contract delivery-outcome --selftest

      - name: Validate automation-routing contract script
        run: node plugin/skills/faff/bin/faff contract automation-routing --selftest

      - name: Validate quality-gates contract script
        run: node plugin/skills/faff/bin/faff contract quality-gates --selftest

      - name: Validate prd-readiness contract script
        run: node plugin/skills/faff/bin/faff contract prd-readiness --selftest

      - name: Validate prdr-admission contract script
        run: node plugin/skills/faff/bin/faff contract prdr-admission --selftest

      - name: Validate adr-admission contract script (FAFF-199)
        run: node plugin/skills/faff/bin/faff contract adr-admission --selftest

      - name: Validate l4-topology-envelope contract script (FAFF-493)
        run: node plugin/skills/faff/bin/faff contract l4-topology-envelope --selftest

      - name: Validate prdr-yagni (upper/YAGNI gate) contract script
        run: node plugin/skills/faff/bin/faff contract prdr-yagni --selftest

      - name: Validate prd-coverage (lower/coverage gate + prd-satisfied roll-up) contract script
        run: node plugin/skills/faff/bin/faff contract prd-coverage --selftest

      - name: Validate prd-distance contract script (FAFF-535)
        run: node plugin/skills/faff/bin/faff contract prd-distance --selftest

      - name: Validate lane-boundary contract script (FAFF-276)
        run: node plugin/skills/faff/bin/faff contract lane-boundary --selftest

      - name: Validate prdr command + the upper-gate arbitration table
        run: node plugin/skills/faff/bin/faff prdr --selftest

      - name: Validate spec-review-verdict contract script
        run: node plugin/skills/faff/bin/faff contract spec-review-verdict --selftest

      - name: Validate architecture-proposal contract script
        run: node plugin/skills/faff/bin/faff contract architecture-proposal --selftest

      - name: Validate env-handle contract script (FAFF-30)
        run: node plugin/skills/faff/bin/faff contract env-handle --selftest

      - name: Validate holdout-verdict contract script (FAFF-34)
        run: node plugin/skills/faff/bin/faff contract holdout-verdict --selftest

      - name: Validate integrity-floor contract script (FAFF-350)
        run: node plugin/skills/faff/bin/faff contract integrity-floor --selftest

      - name: Validate integrity-boundary emitter round-trip (FAFF-514)
        run: node plugin/skills/faff/bin/faff integrity-boundary --selftest

      - name: Validate integrity-digest snapshot/verify tamper detection (FAFF-518)
        run: node plugin/skills/faff/bin/faff integrity-digest --selftest

      - name: Validate post-merge-verification contract script (FAFF-385)
        run: node plugin/skills/faff/bin/faff contract post-merge-verification --selftest

      - name: Validate ci-triage contract script (FAFF-391)
        run: node plugin/skills/faff/bin/faff contract ci-triage --selftest

      - name: Validate merge-gate pure cores (FAFF-350)
        run: node plugin/skills/faff/bin/faff merge-gate --selftest

      - name: Validate branch-protection classifier (FAFF-350)
        run: node plugin/skills/faff/bin/faff branch-protection-check --selftest

      - name: Validate run-end ground-truth reconcile (FAFF-397/680)
        run: node plugin/skills/faff/bin/faff reconcile --selftest

      - name: Validate post-merge-check (FAFF-385)
        run: node plugin/skills/faff/bin/faff post-merge-check --selftest

      - name: Validate ci-triage pure cores (FAFF-391)
        run: node plugin/skills/faff/bin/faff ci-triage --selftest

      - name: Validate governance-check leg-table + AND-aggregation + malformed-ledger table (FAFF-363)
        run: node plugin/skills/faff/bin/faff governance-check --selftest

      - name: Validate dod-classify table (FAFF-34)
        run: node plugin/skills/faff/bin/faff dod --selftest

      - name: Validate holdout verdicts → DoD-verdict map table (FAFF-277)
        run: node plugin/skills/faff/bin/faff holdout --selftest

      - name: Validate the code-blind evaluator spawner pure core (FAFF-384)
        run: node plugin/skills/faffter-noon-evaluate/evaluate-call.mjs --selftest

      - name: Validate engineering-quality gate ladder
        run: node plugin/skills/faff/bin/faff gates --selftest

      - name: Validate run-reconstruction forensics join table (FAFF-289)
        run: node plugin/skills/faff/bin/faff audit --selftest

      - name: Validate infra-profile validator table (FAFF-26)
        run: node plugin/skills/faff/bin/faff profile --selftest

      - name: Validate env compose-gen table (FAFF-270)
        run: node plugin/skills/faff/bin/faff env --selftest

      - name: Validate park-history repeat-park counting table
        run: node plugin/skills/faff/bin/faff park-history --selftest

      - name: Validate queue-state gitkey mint + differ table (FAFF-556)
        run: node plugin/skills/faff/bin/faff queue-state --selftest

      - name: Validate tracker-pin classifier table (FAFF-695)
        run: node plugin/skills/faff/bin/faff tracker --selftest

      - name: Validate prepcheck attach-state audit table
        run: node plugin/skills/faff/bin/faff prepcheck --selftest

      - name: Validate intake-provenance verdict + interactive-bypass table
        run: node plugin/skills/faff/bin/faff intakecheck --selftest

      - name: Validate intake-record via/initiated table
        run: node plugin/skills/faff/bin/faff intake-record --selftest

      - name: Validate gitignore-ensure overlay-glob pattern set + append-order + idempotency table (FAFF-548)
        run: node plugin/skills/faff/bin/faff gitignore-ensure --selftest

      - name: Validate hooks-ensure Stop-hook + PreToolUse registration table
        run: node plugin/skills/faff/bin/faff hooks-ensure --selftest

      - name: Validate merge-fence PreToolUse matcher table (FAFF-434)
        run: node plugin/skills/faff/bin/faff merge-fence --selftest

      - name: Validate contain subtree-of-mandate containment table
        run: node plugin/skills/faff/bin/faff contain --selftest

      - name: Validate budget envelope/state table (FAFF-36)
        run: node plugin/skills/faff/bin/faff budget --selftest

      - name: Validate run-done terminating-condition predicate table (FAFF-38)
        run: node plugin/skills/faff/bin/faff run-done --selftest

      - name: Validate signals.outward producer decision table (FAFF-521)
        run: node plugin/skills/faff/bin/faff run-outward --selftest

      - name: Validate run-start trigger predicate decision table (FAFF-496)
        run: node plugin/skills/faff/bin/faff run-start --selftest

      - name: Validate economics unit-economics + --by breakdown table (FAFF-357/410)
        run: node plugin/skills/faff/bin/faff economics --selftest

      - name: Validate disposition run-end verdict classifier table (FAFF-396)
        run: node plugin/skills/faff/bin/faff disposition --selftest

      - name: Validate sentry derailment-detection + kill-switch table (FAFF-49)
        run: node plugin/skills/faff/bin/faff sentry --selftest

      - name: Validate escaped-side-effect detection table (FAFF-106)
        run: node plugin/skills/faff/bin/faff effects --selftest

      - name: Validate run-termination contract script (FAFF-38)
        run: node plugin/skills/faff/bin/faff contract run-termination --selftest

      - name: Validate run-trigger contract script (FAFF-496)
        run: node plugin/skills/faff/bin/faff contract run-trigger --selftest

      - name: Validate region require-graph fixture table (FAFF-444)
        run: node plugin/skills/faff/bin/faff regions --selftest

      - name: Enforce the governance/factory require-graph direction invariant (FAFF-444)
        run: node plugin/skills/faff/bin/faff regions check

      - name: Governance region standalone selftests (FAFF-444)
        run: node plugin/skills/faff/bin/faff regions selftest --region governance

      - name: Prompt-size budget gate (advisory)
        run: |
          node eval/size-census.mjs --gate --against eval/baselines/prompt-size.json | tee -a "$GITHUB_STEP_SUMMARY"
          # flip to enforcing once the post-lean floor is calibrated:
          #   node eval/size-census.mjs --gate --against eval/baselines/prompt-size.json --enforce

      - name: Assert docker present (env integration test must not silently skip — FAFF-274)
        run: |
          docker info >/dev/null 2>&1 || {
            echo "::error::docker unavailable on a lane that must run the env integration test (FAFF-274)"
            exit 1
          }

      - name: Run skill/CLI behaviour tests (node:test)
        env:
          FAFF_REQUIRE_DOCKER: "1"
        run: node --test

  # FAFF-580: a cheap macOS smoke lane. Operators run faff on macOS day to day (the Colima note in
  # .faffrc.yaml), and CI is otherwise ubuntu-only — this catches a macOS-specific load/parse
  # regression without paying the docker tax on a hosted macOS runner. Pure `--selftest` invocations
  # only: no docker, no `node --test` under FAFF_REQUIRE_DOCKER. The command list is re-derived from
  # this file's own `validate` job rather than duplicated by hand, so a selftest step added there is
  # covered here automatically — the one drift this lane exists to avoid.
  validate-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run every declared --selftest suite (pure, no docker)
        run: |
          set -euo pipefail
          grep -oE 'faff [a-zA-Z0-9_.-]+( [a-zA-Z0-9_.-]+)? --selftest' .github/workflows/validate.yml \
            | sed 's|^|node plugin/skills/faff/bin/|' \
            | sort -u \
            > /tmp/selftests.txt
          echo "node plugin/skills/faffter-noon-evaluate/evaluate-call.mjs --selftest" >> /tmp/selftests.txt
          # Sanity floor: the grep above is only as good as this file's own text, so a
          # reformat or regex miss could silently shrink the list to near-nothing and this
          # lane would go green having tested almost none of it. Fail loud instead of quietly
          # thinning out — bump the floor if the real count ever drops for a legitimate reason.
          count=$(wc -l < /tmp/selftests.txt)
          if [ "$count" -lt 40 ]; then
            echo "::error::only found ${count} --selftest commands to run (expected at least 40) — the extraction regex likely missed some; check .github/workflows/validate.yml"
            exit 1
          fi
          while IFS= read -r cmd; do
            echo "::group::$cmd"
            $cmd
            echo "::endgroup::"
          done < /tmp/selftests.txt

  # FAFF-371: the env lifecycle must also hold against a ROOTLESS daemon reached via DOCKER_HOST —
  # the host-portable stand-in for the bounded nested engine ADR-0041 decision 3 mandates in the
  # L4 cage. The suite runs unmodified: passing against the rootless socket proves the ambient
  # engine-context model with zero engine-specific code in faff. Required lane, no skip path —
  # a rootless-setup failure fails the job loudly (setup fault, distinct from a test failure).
  env-rootless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up a rootless docker daemon (the bounded-engine stand-in)
        run: |
          sudo apt-get update
          sudo apt-get install -y uidmap dbus-user-session slirp4netns
          # the system daemon must be out of the way: this lane validates the ROOTLESS engine,
          # and a lingering /var/run/docker.sock would let a mis-wired test silently pass on it
          sudo systemctl disable --now docker.service docker.socket
          sudo rm -f /var/run/docker.sock
          # hosted runners have no live systemd user session for the runner user — the rootless
          # daemon needs one (and XDG_RUNTIME_DIR), or the direct-launch fallback below
          sudo loginctl enable-linger "$(whoami)"
          sudo systemctl start "user@$(id -u)" || true
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor — rootlesskit
          # (the rootless daemon's namespace helper) needs them
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # user-local rootless install (runner images don't carry Docker's apt repo, so the
          # docker-ce-rootless-extras package has no candidate — the official script installs
          # self-contained binaries under ~/bin instead)
          curl -fsSL https://get.docker.com/rootless | FORCE_ROOTLESS_INSTALL=1 sh
          export PATH="$HOME/bin:$PATH"
          export DOCKER_HOST="unix:///run/user/$(id -u)/docker.sock"
          # start the daemon: the installed systemd user unit, else direct launch; the assert
          # step below is the loud gate if neither produced a reachable rootless daemon
          systemctl --user start docker || { nohup "$HOME/bin/dockerd-rootless.sh" >/tmp/dockerd-rootless.log 2>&1 & } || true
          for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
          echo "$HOME/bin" >> "$GITHUB_PATH"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DOCKER_HOST=unix:///run/user/$(id -u)/docker.sock" >> "$GITHUB_ENV"

      - name: Assert the daemon is rootless (a setup fault fails the job loudly — never a silent host-daemon pass)
        run: |
          docker info >/dev/null 2>&1 || {
            echo "::error::rootless dockerd unreachable at ${DOCKER_HOST} — rootless setup failed (FAFF-371)"
            exit 1
          }
          docker info --format '{{.SecurityOptions}}' | grep -q rootless || {
            echo "::error::daemon at ${DOCKER_HOST} is not rootless — this lane must validate the rootless engine (FAFF-371)"
            exit 1
          }

      - name: Run env + holdout integration suites against the rootless engine
        env:
          FAFF_REQUIRE_DOCKER: "1"
        run: node --test test/env.test.mjs test/holdout-evaluate-integration.test.mjs
