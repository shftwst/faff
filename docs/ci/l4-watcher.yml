# =============================================================================
# l4-watcher.yml — REFERENCE workflow (an example to copy, not a live faff CI job)
# =============================================================================
#
# The L4 sibling of l3-watcher.yml. Same reasons for living under docs/ci/ rather
# than .github/workflows/: its `runs-on:` names a rig that must exist first, and
# "a committed job whose label matches nothing is a small lie" (see
# .github/workflows/job-surface-probe.yml). Copy it into an OUTWARD product repo's
# .github/workflows/ once you have the rig, the cage, and the seat secret.
#
# WHAT IT IS
#   An out-of-the-loop (L4) autonomous factory: a cron firing resolves an open run
#   or mints one, drains a SEGMENT under a budget cap, and the NEXT firing continues
#   the SAME run via `faff lights-out --resume <run-id>` until the run is done.
#   Correctness is held up by adversarial machinery (a second model, a code-blind
#   holdout), not by a human reading the morning parks.
#
# WHY AN OUTWARD REPO (not faff itself)
#   L4 refuses on faff's own repo: `faff run-outward` returns outward:false /
#   self-referential, so run-start refuses self-directed (ADR-0069). That is why the
#   faff-on-faff watcher is the L3 shape (l3-watcher.yml) and this one targets an
#   OUTWARD product repo. Point tracking.repo / tracking.container at your product.
#
# HOW SEGMENTATION ACTUALLY WORKS (read this — it is not "checkpoint and exit")
#   `faff lights-out --resume <id>` re-enters a ledger ONLY if the run stopped in a
#   re-enterable state: escalated | dead-running | aborted-resumable. A GRACEFUL
#   clean exit sets owner.status:done → done-clean → resume REFUSES it. So a segment
#   boundary must be an ESCALATION: set a per-segment budget/window ceiling
#   (--until / --max / budget.window, at-ceiling escalate) so the segment ends
#   `escalated`, which the next firing re-enters. The job `timeout-minutes` hard-kill
#   is the fallback (it leaves `dead-running`), but that path only becomes resumable
#   once the heartbeat ages past its stale window (~900s), so THE CRON INTERVAL MUST
#   EXCEED THE HEARTBEAT-STALE WINDOW or the next firing sees a live heartbeat and
#   refuses. Prefer the escalation boundary; treat the hard-kill as a safety net.
#
# PREREQUISITES the operator provides (see docs/guide/unattended.md):
#   - an admitted cage that passes `faff container-check --gate` (FAFF-651 documents
#     one; claude-box is an example, any passing cage works);
#   - a self-hosted runner with a PERSISTENT, non-cleaned workspace on ONE runner
#     (resume reads .faff/runs/<id>/run-ledger.json; it is runtime state, not
#     git-tracked, so it survives only if the same runner keeps its workspace);
#   - the L4 dial-coherence config: `slots.spec_review: faffter-dark-spec-review` in
#     a gitignored .faffrc.local.yaml (gates.fallback already defaults fail-closed);
#   - `slots.concurrency` sequential/unset (resume is sequential-executor only — a
#     DIFFERENT axis from the workflow `concurrency:` block below);
#   - a subscription-seat/API-key secret (auth matrix on the drain step);
#   - a budget ceiling — `budget.until`/`budget.max`/`budget.tokens`/`budget.cost` in
#     `.faffrc` (the preflight and the mint both refuse without one; the `--max` on the
#     drain caps the segment, but a run-level ceiling is still required);
#   - `jq` on the runner (used to parse `faff … --json`).
#
# =============================================================================

name: l4-watcher (reference)

on:
  # The interval MUST exceed the heartbeat-stale window (~900s) for the hard-kill
  # fallback to be resumable; every 30 min is a safe default. Escalation boundaries
  # do not need this, but the interval is a single knob, so keep it conservative.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

# Serialise firings so two never touch the same ledger at once (also avoids a
# spurious `live-running` resume refusal). This is the workflow axis; it is NOT the
# same as faff's `slots.concurrency` (which resume also requires to be sequential).
concurrency:
  group: l4-watcher-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drain:
    # EXAMPLE label — the admission gate, not this label, decides admission.
    runs-on: [self-hosted, faff-l4]
    # Hard wall-clock cap = the hard-kill fallback boundary. The primary boundary is
    # the per-segment budget ceiling on the drain step (which escalates gracefully).
    timeout-minutes: 300

    steps:
      # 1. ADMISSION GATE — first, before any mint/claim. Identical to the L3 watcher.
      #    Exits 0 iff contained AND no host engine socket reachable (ADR-0095;
      #    the check is FAFF-655). Any cage that passes works — see the worked cage
      #    in docs/guide/unattended.md → "A cage that passes the gate".
      #
      #    SOCKET TRAP: do NOT reach for a plain job `container:` — on a socket-bearing
      #    runner host the runner bind-mounts /var/run/docker.sock into it (an in-job
      #    rm -f can't unmount it); deal with the socket at the runner-host level, or
      #    run the job inside a cage that never had it.
      - name: Admission gate (contained + no host engine socket reachable)
        run: faff container-check --gate

      - uses: actions/checkout@v4

      # 2. PREFLIGHT DEMONSTRATION — the testable half of "the L4 preflight clears with
      #    no bypass". `--check` runs the full 8-guardrail preflight and mints nothing.
      #    It refuses (nonzero) if the cage, the budget ceiling, or the dial-coherence
      #    config (adversarial slots.spec_review) is not in place — so a misconfigured
      #    rig fails here, loudly, before any run is minted.
      - name: Lights-out preflight (dry-run, mints nothing)
        run: faff lights-out --check

      # 3. RESOLVE-RESUME-OR-MINT + DRAIN A SEGMENT.
      #    AUTH MATRIX (ADR-0092), pick ONE column:
      #      solo  — self-hosted runner + a subscription seat as a long-lived env-var
      #              token (the CI path). The env key must match your harness:
      #              claude -p reads CLAUDE_CODE_OAUTH_TOKEN; a Codex harness reads its
      #              own. Held as a secret, never a committed rc (ADR-0067).
      #      team  — a hosted runner + a metered API key via the backend's api_key_env.
      #    Seats are per-operator, never pooled. faff consumes the seat; it never logs in.
      - name: Resolve open run (resume) or mint, then drain a segment (L4)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.FAFF_CI_SEAT_TOKEN }}
        run: |
          set -eu

          # (a) Resolve the newest run dir on this persistent workspace and classify it.
          #     We do NOT use `faff run-done` here — that verb composes signals from flags
          #     and never reads a ledger, so it cannot answer "is this run done?".
          #     `lights-out --resume <id> --check` self-classifies, with THREE exit codes:
          #       0 → re-enterable            → RESUME the same run-id
          #       1 → recoverable/needs-config (still-over-budget / preflight / lock) →
          #           an open run that can't resume right now: surface it, do NOT mint a
          #           parallel run
          #       2 → terminal (done/unparseable/missing) → MINT a fresh run
          latest=$(ls -1dt .faff/runs/*/ 2>/dev/null | head -1 | sed 's:/*$::' || true)
          run_dir=""
          if [ -n "${latest:-}" ]; then
            id=$(basename "$latest")
            rc=0
            faff lights-out --resume "$id" --check >/dev/null 2>&1 || rc=$?
            case "$rc" in
              0)  # RESUME — re-enter the SAME ledger (same run-id). §0a is NOT re-run:
                  # the PRD/target mandate is fixed at the original mint, so a PRD edited
                  # mid-run cannot silently re-scope work already in flight.
                  run_dir="$latest"
                  faff lights-out --resume "$id" ;;
              1)  # An open run that needs attention (not a fresh mint). Surface it and
                  # let the reconcile step below score it — never start a parallel run.
                  echo "open run $id is not currently resumable (exit 1: over-budget / preflight / lock) — not minting a parallel run"
                  echo "FAFF_RUN_DIR=$latest" >> "$GITHUB_ENV"
                  exit 1 ;;
              *)  # exit 2 → the newest run is terminal; fall through to mint.
                  run_dir="" ;;
            esac
          fi

          if [ -z "$run_dir" ]; then
            # MINT a fresh run. §0a (the outward/PRD mandate — the self-directed refusal
            # that keeps faff from building faff) runs authoritatively INSIDE
            # /faff-beep-boop; this reference deliberately does NOT re-implement it. An
            # adopter who wants to skip the agent spawn on a refuse firing can add the
            # cheap pure-CLI pre-gate from beep-boop §0a here (prd list + run-outward +
            # run-start), following that skill's exact SelfRef resolution — do not
            # hand-roll the outward/self oracle, it is subtle and easy to get wrong.
            # Capture the run dir from --json (.run_dir): the plain-text banner is
            # "Preflight PASS — L4 run minted: <dir>", so the older
            # `sed -n 's/^run dir: //p'` idiom in the guide is a mismatch; use --json.
            run_dir=$(faff lights-out --json | jq -r .run_dir)
          fi

          echo "FAFF_RUN_DIR=$run_dir" >> "$GITHUB_ENV"
          # Drain the segment. `--max N` caps the segment at N builds; at L4 the
          # at-ceiling default is `escalate`, so hitting the cap ends the segment in the
          # `escalated` state the NEXT firing can resume. (Prefer `--max` over `--until`
          # here: `--until HH:MM` is an absolute wall-clock time, not a fixed-size cap, so
          # it cannot express "this segment lasts N units" independent of time-of-day.)
          FAFF_APPETITE=full FAFF_RUN_DIR="$run_dir" claude -p "/faff-beep-boop --max 5"

      # 4. RECONCILE — a segment boundary is green ("more to come"), a terminal run is
      #    scored by disposition. `lights-out --resume <id> --check` has THREE exit
      #    classes; branch on 0-vs-nonzero (NOT 0-vs-2, which would drop exit 1):
      #      exit 0 — re-enterable → this firing exits 0; the next firing continues.
      #      nonzero — terminal or needs-config (exit 1 = still-over-budget / preflight
      #                / lock contention; exit 2 = done-clean / unparseable / missing
      #                ledger / parallel slot). Hand to `faff disposition`, whose exit
      #                is authoritative (green only on a genuinely done-clean run).
      - name: Reconcile — resumable boundary (green) vs terminal run (disposition)
        if: always()
        run: |
          set -u
          [ -n "${FAFF_RUN_DIR:-}" ] || { echo "no run dir for this firing — failing"; exit 1; }
          if faff lights-out --resume "$(basename "$FAFF_RUN_DIR")" --check >/dev/null 2>&1; then
            echo "segment boundary — the run is re-enterable; the next firing continues. (green)"
            exit 0
          fi
          # terminal or needs-config → disposition is the authoritative red/green exit
          faff disposition --run-dir "$FAFF_RUN_DIR"
